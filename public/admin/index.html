<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enif OOH · Administração (teste)</title>
<style>
  :root{--bg:#f3f6fb;--card:#fff;--fg:#121826;--mu:#586174;--ac:#1D5FE5;--ok:#0F7A3A;--bad:#B3261E;--ln:#dfe5ef}
  @media(prefers-color-scheme:dark){:root{--bg:#0d1220;--card:#171d2d;--fg:#eef2f9;--mu:#a5b0c3;--ac:#6E9CFF;--ok:#5ED28E;--bad:#FF8C86;--ln:#2a3248}}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,Segoe UI,sans-serif}
  main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0 0 12px}
  .note{color:var(--mu);margin:0 0 18px}.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:16px}
  input,select,button{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--fg)}
  button{cursor:pointer;background:var(--ac);color:#fff;border:0;font-weight:600}button.g{background:none;color:var(--ac);border:1px solid var(--ln)}button.d{background:none;color:var(--bad);border:1px solid var(--ln)}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:10px}.row label{display:grid;gap:3px;font-size:12.5px;color:var(--mu)}
  table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-top:1px solid var(--ln);text-align:left;vertical-align:top}th{font-size:12.5px;color:var(--mu);border:0}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--bad)}.dot.on{background:var(--ok)}
  code{background:var(--bg);padding:2px 6px;border-radius:6px;word-break:break-all;font-size:12.5px}.err{color:var(--bad)}.mu{color:var(--mu)}
  .files{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0}.files label{display:flex;gap:6px;align-items:center;color:var(--fg);font-size:14px}
</style>
</head>
<body><main>
<h1>Enif OOH · Administração</h1>
<p class="note">Página de teste para ligar o primeiro ecrã. A interface final (a do protótipo) liga-se a esta mesma API mais tarde.</p>
<div class="card" id="login" hidden><h2>Chave de administração</h2><div class="row"><input id="tok" type="password" placeholder="ADMIN_TOKEN"><button id="tok-go">Entrar</button></div><p class="err" id="login-e"></p></div>
<div id="app" hidden>
<div class="card"><h2>Alertas</h2><div id="alerts"></div></div>
<div class="card"><h2>Ecrãs</h2><div id="screens"></div>
  <h2 style="margin-top:16px">Novo ecrã</h2>
  <div class="row"><label>Local<input id="s-venue" placeholder="Estação Rodoviária"></label><label>Sítio<input id="s-spot" placeholder="Átrio"></label><label>Liga (h)<input id="s-on" type="number" min="0" max="24" value="0" style="width:80px"></label><label>Desliga (h)<input id="s-off" type="number" min="0" max="24" value="24" style="width:80px"></label><button id="s-add">Criar ecrã</button></div></div>
<div class="card"><h2>Conteúdos</h2><div id="files"></div>
  <div class="row" style="margin-top:12px"><label>Imagem ou vídeo<input id="f-file" type="file" accept="image/*,video/*"></label><label>Duração da imagem (s)<input id="f-dur" type="number" min="1" value="10" style="width:90px"></label><button id="f-add">Enviar</button><span class="mu" id="f-st"></span></div></div>
<div class="card"><h2>Campanhas</h2><div id="camps"></div>
  <h2 style="margin-top:16px">Nova campanha</h2>
  <div class="row"><label>Nome<input id="c-name"></label><label>Cliente<input id="c-client"></label><label>Local<select id="c-venue"></select></label><label>De<input id="c-start" type="date"></label><label>Até<input id="c-end" type="date"></label><label>Das (h)<input id="c-h0" type="number" min="0" max="24" value="0" style="width:70px"></label><label>Às (h)<input id="c-h1" type="number" min="0" max="24" value="24" style="width:70px"></label><label>Vezes/min<input id="c-ppm" type="number" min="1" max="12" value="1" style="width:70px"></label><label>Prioridade<select id="c-pri"><option>Normal</option><option>Alta</option><option>Baixa</option></select></label></div>
  <div class="files" id="c-files"></div><div class="row"><button id="c-add">Criar campanha</button><span class="err" id="c-e"></span></div></div>
<div class="card"><h2>Passagens de hoje por campanha</h2><div id="rep"></div></div>
</div>
</main>
<script>
(function(){
var $=function(s){return document.querySelector(s)},tok=localStorage.getItem('enif.admin')||'',O=null;
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
function api(m,p,b,raw){return fetch(p,{method:m,headers:Object.assign({'x-admin-token':tok},b&&!raw?{'Content-Type':'application/json'}:{}),body:b?(raw?b:JSON.stringify(b)):undefined}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j})})}
function ago(t){if(!t)return 'nunca';var m=Math.round((Date.now()-t)/60000);return m<1?'agora':'há '+m+' min'}
function load(){return api('GET','/api/admin/overview').then(function(o){O=o;$('#login').hidden=true;$('#app').hidden=false;draw();return api('GET','/api/admin/report?from='+(Date.now()-86400000)).then(function(r){drawRep(r)})}).catch(function(e){$('#app').hidden=true;$('#login').hidden=false;$('#login-e').textContent=tok?e.message:''})}
function draw(){
  $('#alerts').innerHTML=O.alerts.length?O.alerts.map(function(a){return '<div><span class="dot"></span><b>'+esc(a.title)+'</b> · '+esc(a.screen)+' <span class="mu">'+esc(a.detail)+'</span></div>'}).join(''):'<span class="mu">Sem alertas. Todos os ecrãs responderam nos últimos 2 minutos.</span>';
  $('#screens').innerHTML=O.screens.length?'<table><tr><th>Ecrã</th><th>Estado</th><th>A passar</th><th>Hoje</th><th>Endereço do player</th><th></th></tr>'+O.screens.map(function(s){
    var url=location.origin+'/player/?code='+s.code+'&key='+s.key,nm=function(id,l){var x=l.find(function(i){return i.id===id});return x?x.name:id};
    return '<tr><td><b>'+esc(s.code)+'</b><br>'+esc(s.venue)+(s.spot?', '+esc(s.spot):'')+'</td><td><span class="dot'+(s.online?' on':'')+'"></span>'+(s.online?'Online':'Offline')+'<br><span class="mu">'+ago(s.lastSeen)+'</span></td><td>'+(s.online&&s.nowCamp?esc(nm(s.nowCamp,O.campaigns))+'<br><span class="mu">'+esc(nm(s.nowFile,O.files))+'</span>':'<span class="mu">—</span>')+'</td><td>'+s.playsToday+(s.queue?'<br><span class="mu">'+s.queue+' por enviar</span>':'')+'</td><td><code>'+esc(url)+'</code></td><td><button class="d" data-del-s="'+s.id+'">Apagar</button></td></tr>'}).join('')+'</table>':'<span class="mu">Ainda não há ecrãs.</span>';
  $('#files').innerHTML=O.files.length?'<table>'+O.files.map(function(f){return '<tr><td>'+esc(f.name)+'</td><td>'+esc(f.type)+'</td><td>'+f.dur+' s</td><td>'+(f.size/1048576).toFixed(1)+' MB</td><td><button class="d" data-del-f="'+f.id+'">Apagar</button></td></tr>'}).join('')+'</table>':'<span class="mu">Sem conteúdos.</span>';
  $('#camps').innerHTML=O.campaigns.length?'<table><tr><th>Campanha</th><th>Local</th><th>Datas</th><th>Horas</th><th>Vídeos</th><th></th></tr>'+O.campaigns.map(function(c){return '<tr><td><b>'+esc(c.name)+'</b><br><span class="mu">'+esc(c.client)+' · '+c.ppm+'×/min · '+esc(c.priority)+'</span></td><td>'+esc(c.venues.join(', '))+'</td><td>'+esc(c.start)+' → '+esc(c.end)+'</td><td>'+c.h0+'h–'+c.h1+'h</td><td>'+c.items.length+'</td><td><button class="d" data-del-c="'+c.id+'">Apagar</button></td></tr>'}).join('')+'</table>':'<span class="mu">Sem campanhas.</span>';
  var venues=[];O.screens.forEach(function(s){if(venues.indexOf(s.venue)<0)venues.push(s.venue)});
  $('#c-venue').innerHTML=venues.map(function(v){return '<option>'+esc(v)+'</option>'}).join('');
  $('#c-files').innerHTML=O.files.length?O.files.map(function(f){return '<label><input type="checkbox" value="'+f.id+'">'+esc(f.name)+'</label>'}).join(''):'<span class="mu">Envie conteúdos primeiro.</span>';
}
function drawRep(r){var nm=function(id){var c=O.campaigns.find(function(x){return x.id===id});return c?c.name:id};
  $('#rep').innerHTML=r.byCampaign.length?'<table>'+r.byCampaign.map(function(x){return '<tr><td>'+esc(nm(x.camp))+'</td><td>'+x.plays+' passagens</td></tr>'}).join('')+'</table>'+(r.failures?'<p class="err">'+r.failures+' falhas de reprodução.</p>':''):'<span class="mu">Ainda sem passagens.</span>'}
$('#tok-go').onclick=function(){tok=$('#tok').value;localStorage.setItem('enif.admin',tok);load()};
$('#s-add').onclick=function(){api('POST','/api/admin/screens',{venue:$('#s-venue').value,spot:$('#s-spot').value,on:$('#s-on').value,off:$('#s-off').value}).then(load).catch(function(e){alert(e.message)})};
$('#c-add').onclick=function(){
  var ids=[].slice.call(document.querySelectorAll('#c-files input:checked')).map(function(i){return {f:i.value}});
  api('POST','/api/admin/campaigns',{name:$('#c-name').value,client:$('#c-client').value,venues:[$('#c-venue').value],start:$('#c-start').value,end:$('#c-end').value,h0:$('#c-h0').value,h1:$('#c-h1').value,ppm:$('#c-ppm').value,priority:$('#c-pri').value,items:ids}).then(function(){$('#c-e').textContent='';load()}).catch(function(e){$('#c-e').textContent=e.message})};
$('#f-add').onclick=function(){
  var f=$('#f-file').files[0];if(!f)return;$('#f-st').textContent='A enviar…';
  var go=function(dur){fetch('/api/admin/files?name='+encodeURIComponent(f.name)+'&mime='+encodeURIComponent(f.type)+'&dur='+dur,{method:'PUT',headers:{'x-admin-token':tok},body:f}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error);return j})}).then(function(){$('#f-st').textContent='Enviado.';$('#f-file').value='';load()}).catch(function(e){$('#f-st').textContent=e.message})};
  if(/^video/.test(f.type)){var v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=function(){go(Math.round(v.duration*10)/10)};v.onerror=function(){go(10)};v.src=URL.createObjectURL(f)}else go($('#f-dur').value||10)};
document.addEventListener('click',function(e){var t=e.target;
  if(t.dataset.delS&&confirm('Apagar este ecrã?'))api('DELETE','/api/admin/screens/'+t.dataset.delS).then(load);
  if(t.dataset.delF)api('DELETE','/api/admin/files/'+t.dataset.delF).then(load).catch(function(x){alert(x.message)});
  if(t.dataset.delC&&confirm('Apagar esta campanha?'))api('DELETE','/api/admin/campaigns/'+t.dataset.delC).then(load)});
load();setInterval(function(){if(!$('#app').hidden)load()},15000);
})();
</script>
</body></html>
