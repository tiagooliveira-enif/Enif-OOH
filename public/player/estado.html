<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estado do player Enif</title>
<style>
  html, body {margin: 0; background: #101114; color: #e8e8ea; font: 15px/1.5 Consolas, "Courier New", monospace;}
  main {padding: 18px 22px;}
  h1 {font: 600 14px system-ui, sans-serif; color: #ffe651; margin: 0 0 10px;}
  pre {white-space: pre-wrap; margin: 0;}
  .old {color: #ff8a80;}
  small {display: block; margin-top: 12px; color: #9a9aa2; font: 12px system-ui, sans-serif;}
</style>
</head>
<body>
<main>
  <h1>Estado do player (atualiza sozinho)</h1>
  <pre id="t">A aguardar o player…</pre>
  <small id="a"></small>
</main>
<script>
/* lê o estado que o player guarda no navegador (mesma origem e mesmo perfil) e mostra-o nesta janela, que pode estar noutro ecrã */
try {window.moveTo(40, 40);} catch (e) {/* sem ação */}   // tenta ir para o canto do ecrã principal (o navegador pode não deixar; nesse caso arrasta a janela uma vez)
const t = document.getElementById('t'), a = document.getElementById('a');
function draw() {
  let o = null;
  try {o = JSON.parse(localStorage.getItem('enif.dbg') || 'null');} catch (e) {/* sem ação */}
  if (!o) {t.textContent = 'O player ainda não escreveu o estado. Tem de estar aberto neste PC.'; a.textContent = ''; return;}
  const s = Math.round((Date.now() - o.t) / 1000);
  t.textContent = o.s;
  a.textContent = s > 5 ? 'Atenção: o estado foi atualizado há ' + s + ' s (o player pode estar parado).' : 'Atualizado agora.';
  a.className = s > 5 ? 'old' : '';
}
draw(); setInterval(draw, 1000);
</script>
</body>
</html>
