<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enif OOH · Player</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;cursor:none;font-family:system-ui,Segoe UI,sans-serif}
  #stage{position:fixed;inset:0;background:#000}
  #stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  #stage img,#stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  #idle{position:fixed;inset:0;display:none;place-items:center;text-align:center;color:#556;font-size:22px}
  #dbg{position:fixed;left:8px;bottom:8px;font:12px/1.4 ui-monospace,Consolas,monospace;color:#9fb;background:rgba(0,0,0,.7);padding:6px 8px;border-radius:6px;display:none;white-space:pre}
  #setup{position:fixed;inset:0;display:none;place-items:center;background:#0b1020;cursor:auto}
  #setup form{display:grid;gap:12px;width:320px}
  #setup input,#setup button{padding:12px;border-radius:10px;border:0;font-size:16px}
  #setup button{background:#1D5FE5;color:#fff;font-weight:600}
</style>
</head>
<body>
<div id="stage"></div>
<div id="idle"><div>Enif OOH<br><small id="idle-t"></small></div></div>
<div id="dbg"></div>
<div id="setup"><form id="setup-f"><h2>Configurar ecrã</h2><input name="code" placeholder="Código (ex.: ECR-001)" required><input name="key" placeholder="Chave do ecrã" required><button>Guardar e iniciar</button></form></div>
<script>
(function(){
'use strict';
var VERSION='2';
var Q=new URLSearchParams(location.search);
var ls=function(k,v){try{if(v===undefined){var x=localStorage.getItem(k);return x==null?null:x}if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}};
var code=Q.get('code')||ls('enif.code'),key=Q.get('key')||ls('enif.key');
var HB=(+Q.get('hb')||30)*1000, FLUSH=(+Q.get('flush')||20)*1000, REFRESH=(+Q.get('refresh')||60)*1000;   // (parâmetros só para testes)
var $=function(s){return document.querySelector(s)};
var stage=$('#stage'),dbg=$('#dbg');
var PL=null,cache=null,have={},counter={},cur={c:null,f:null},stats={plays:0,fails:0,net:'?',cached:0,err:''};
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
var uid=function(){return (crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))};

if(!code||!key){$('#setup').style.display='grid';
  $('#setup-f').onsubmit=function(e){e.preventDefault();var f=new FormData(e.target);ls('enif.code',String(f.get('code')).trim());ls('enif.key',String(f.get('key')).trim());location.replace(location.pathname)};
  return;
}
if(Q.get('code')&&Q.get('key')){ls('enif.code',code);ls('enif.key',key)}
try{counter=JSON.parse(ls('enif.counter')||'{}')}catch(e){counter={}}

/* ---------- hora em Lisboa ---------- */
function lisbon(){
  var p={};new Intl.DateTimeFormat('en-GB',{timeZone:(PL&&PL.tz)||'Europe/Lisbon',hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(new Date()).forEach(function(x){p[x.type]=x.value});
  return {date:p.year+'-'+p.month+'-'+p.day,h:+p.hour};
}
/* ---------- fila de passagens (sobrevive a quedas de internet e a reinícios) ---------- */
var queue=[];try{queue=JSON.parse(ls('enif.queue')||'[]')}catch(e){queue=[]}
var saveQ=function(){ls('enif.queue',JSON.stringify(queue.slice(-5000)))};
function logPlay(c,f,dur,ok){queue.push({pid:uid(),c:c,f:f,ts:Date.now(),dur:Math.round(dur*10)/10,ok:ok?1:0});saveQ();if(ok)stats.plays++;else stats.fails++}
function post(path,body){
  body.code=code;body.key=key;
  return fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()});
}
function flush(){
  if(!queue.length)return Promise.resolve();
  var batch=queue.slice(0,500);
  return post('/api/player/plays',{plays:batch}).then(function(r){
    var ok={};(r.received||[]).forEach(function(id){ok[id]=1});
    queue=queue.filter(function(x){return !ok[x.pid]});saveQ();stats.net='ok';
  }).catch(function(e){stats.net='sem ligação'});
}
function heartbeat(){
  return post('/api/player/heartbeat',{c:cur.c,f:cur.f,queue:queue.length,ver:VERSION,w:screen.width,h:screen.height}).then(function(){stats.net='ok'}).catch(function(){stats.net='sem ligação'});
}
/* ---------- playlist e ficheiros em cache ---------- */
var mediaUrl=function(id){return '/media/'+id+'?code='+encodeURIComponent(code)+'&key='+encodeURIComponent(key)};
var cacheKey=function(id,f){return '/cache/'+id+'/'+(f.size||0)};
async function openCache(){try{if(window.caches)cache=await caches.open('enif-media-v1')}catch(e){cache=null}}
async function ensureFiles(){
  if(!PL)return;
  var ids=Object.keys(PL.files);
  for(var i=0;i<ids.length;i++){
    var id=ids[i],f=PL.files[id],k=cacheKey(id,f);
    if(have[id]===k)continue;
    try{
      if(cache&&await cache.match(k)){have[id]=k;continue}
      var r=await fetch(mediaUrl(id));if(!r.ok)throw new Error('HTTP '+r.status);
      if(cache){await cache.put(k,r);have[id]=k}else{have[id]='net'}
    }catch(e){stats.err='transferência '+id+': '+e.message}
  }
  if(cache){ // apaga o que já não é usado
    var keys=await cache.keys(),want=ids.map(function(i){return location.origin+cacheKey(i,PL.files[i])});
    for(var j=0;j<keys.length;j++)if(want.indexOf(keys[j].url)<0)await cache.delete(keys[j]);
  }
  stats.cached=Object.keys(have).length;
}
async function refresh(){
  try{
    var r=await fetch('/api/player/playlist?code='+encodeURIComponent(code)+'&key='+encodeURIComponent(key));
    if(r.status===401){stats.err='código/chave inválidos';return}
    if(!r.ok)throw new Error('HTTP '+r.status);
    var j=await r.json();stats.net='ok';stats.err='';
    if(j.playerVersion!==VERSION){location.reload();return}
    var rl=ls('enif.reload');if(rl!==null&&+rl!==j.reload){ls('enif.reload',String(j.reload));location.reload();return}
    ls('enif.reload',String(j.reload));
    PL=j;ls('enif.playlist',JSON.stringify(j));
  }catch(e){stats.net='sem ligação';if(!PL){try{PL=JSON.parse(ls('enif.playlist')||'null')}catch(x){PL=null}}}
  await ensureFiles();
}
/* ---------- reprodução ---------- */
function clear(){while(stage.firstChild){var n=stage.firstChild;if(n.tagName==='VIDEO'){try{n.pause();n.removeAttribute('src');n.load()}catch(e){}}stage.removeChild(n)}}
async function srcFor(id,f){
  if(cache){var r=await cache.match(cacheKey(id,f));if(r){var b=await r.blob();return {url:URL.createObjectURL(b),revoke:true}}}
  return null;
}
async function playOne(c,id,secs){
  var f=PL.files[id];if(!f)return false;
  var s=await srcFor(id,f);
  if(!s){ if(stats.net==='ok'&&!cache)s={url:mediaUrl(id),revoke:false}; else return false }
  cur={c:c,f:id};var t0=Date.now(),ok=true;
  clear();$('#idle').style.display='none';
  if(f.type==='Vídeo'){
    var v=document.createElement('video');v.muted=true;v.autoplay=true;v.playsInline=true;v.src=s.url;stage.appendChild(v);
    await new Promise(function(done){
      var end=function(good){ok=good;done()};
      v.onended=function(){end(true)};v.onerror=function(){end(false)};
      setTimeout(function(){end(false)},Math.max(20,(f.dur||10)*2+10)*1000);
      var pr=v.play();if(pr&&pr.catch)pr.catch(function(){end(false)});
    });
  }else if(f.type==='HTML5'){
    var fr=document.createElement('iframe');fr.setAttribute('sandbox','allow-scripts');fr.src=s.url;stage.appendChild(fr);
    await sleep(Math.max(1,secs||f.dur||10)*1000);
  }else{
    var im=document.createElement('img');im.src=s.url;stage.appendChild(im);
    await new Promise(function(d){im.onload=d;im.onerror=function(){ok=false;d()}});
    await sleep(Math.max(1,secs||f.dur||10)*1000);
  }
  if(s.revoke)setTimeout(function(){URL.revokeObjectURL(s.url)},3000);
  logPlay(c,id,(Date.now()-t0)/1000,ok);
  return ok;
}
function showIdle(black,msg){clear();cur={c:null,f:null};var i=$('#idle');i.style.display=black?'none':'grid';$('#idle-t').textContent=msg||''}
var lastHour=null,idx=0;
async function loop(){
  for(;;){
    try{
      if(!PL){showIdle(false,'A aguardar playlist…');await sleep(2000);continue}
      var now=lisbon(),key2=now.date+' '+now.h,day=PL.days[now.date],entries=day?day[now.h]:undefined;
      if(key2!==lastHour){lastHour=key2;idx=0}
      if(entries===null){showIdle(true);await sleep(5000);continue}          // ecrã desligado a esta hora
      if(!entries||!entries.length){showIdle(false,PL.screen.venue+' · sem campanhas agora');await sleep(5000);continue}
      var e=entries[idx%entries.length];idx++;
      var n=(counter[e.c]||0);counter[e.c]=n+1;ls('enif.counter',JSON.stringify(counter));
      var id=e.items[n%e.items.length];
      var ok=await playOne(e.c,id,e.dur);
      if(!ok)await sleep(1500);                                              // evita ciclo apertado se faltar um ficheiro
    }catch(err){stats.err=String(err&&err.message||err);await sleep(2000)}
  }
}
/* ---------- arranque ---------- */
function drawDbg(){dbg.textContent='Enif OOH player '+VERSION+'\necrã '+code+'\nrede '+stats.net+'\npassagens '+stats.plays+' (falhas '+stats.fails+')\npor enviar '+queue.length+'\nficheiros em cache '+stats.cached+'\na passar '+(cur.c||'-')+' / '+(cur.f||'-')+(stats.err?'\n'+stats.err:'')}
document.addEventListener('keydown',function(e){if(e.key==='d'||e.key==='D'){dbg.style.display=dbg.style.display==='block'?'none':'block'}if(e.key==='r'&&e.ctrlKey&&e.shiftKey){ls('enif.code',null);ls('enif.key',null);location.replace(location.pathname)}});
if(Q.get('debug'))dbg.style.display='block';
setInterval(drawDbg,1000);
(async function(){
  try{if('serviceWorker' in navigator)navigator.serviceWorker.register('/player/sw.js',{scope:'/player/'})}catch(e){}
  await openCache();
  PL=null;try{PL=JSON.parse(ls('enif.playlist')||'null')}catch(e){}
  loop();
  await refresh();
  setInterval(refresh,REFRESH);setInterval(heartbeat,HB);setInterval(flush,FLUSH);
  heartbeat();
  // recarrega a página uma vez por dia (3h da manhã) para evitar fugas de memória
  setInterval(function(){var n=new Date();if(n.getHours()===3&&n.getMinutes()===0&&performance.now()>3600e3)location.reload()},60000);
})();
})();
</script>
</body>
</html>
