<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enif DOOH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Liquid Glass: translucent, blurred surfaces floating over soft colour fields, with a bright specular edge.
   Large panels blur what is behind them; small controls stay translucent without blur to keep it light.
   Layout: floating sidebar + one working column; a floating glass tab bar on phones. */
:root {
  --bg: #e8eef8;
  --solid: #f6f8fc;
  --orb1: rgba(255, 205, 40, 0.5);
  --orb2: rgba(80, 170, 255, 0.34);
  --orb3: rgba(255, 120, 110, 0.34);
  --orb4: rgba(80, 170, 255, 0.34);
  --surface: rgba(255, 255, 255, 0.55);
  --surface-strong: rgba(255, 255, 255, 0.76);
  --surface-2: rgba(255, 255, 255, 0.42);
  --field: rgba(255, 255, 255, 0.64);
  --field-hover: rgba(255, 255, 255, 0.88);
  --sheen: rgba(255, 255, 255, 0.45);
  --hi: rgba(255, 255, 255, 0.92);
  --edge: rgba(255, 255, 255, 0.78);
  --shadow:
    0 12px 36px rgba(31, 48, 96, 0.13), 0 2px 8px rgba(31, 48, 96, 0.06);
  --shadow-sm: 0 1px 3px rgba(31, 48, 96, 0.14);
  --fg: #121826;
  --muted: #4d586b;
  --line: rgba(25, 40, 80, 0.1);
  --line-strong: rgba(25, 40, 80, 0.22);
  --accent: #1d5fe5;
  --accent-text: #1646b0;
  --accent-ink: #ffffff;
  --accent-soft: rgba(29, 95, 229, 0.14);
  --ok: #09602c;
  --ok-soft: rgba(22, 140, 72, 0.15);
  --warn: #8f5200;
  --warn-soft: rgba(235, 150, 20, 0.2);
  --bad: #b3261e;
  --bad-soft: rgba(220, 60, 50, 0.15);
  --bar: rgba(50, 75, 130, 0.28);
  --c1: #1d5fe5;
  --c2: #0b8587;
  --c3: #b4501b;
  --c4: #66771a;
  --c5: #8a4f9e;
  --c6: #47546a;
  --font: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #080c14;
    --solid: #141a25;
    --orb1: rgba(255, 200, 40, 0.26);
    --orb2: rgba(60, 140, 255, 0.26);
    --orb3: rgba(255, 100, 90, 0.18);
    --orb4: rgba(60, 140, 255, 0.26);
    --surface: rgba(30, 37, 52, 0.55);
    --surface-strong: rgba(26, 32, 46, 0.8);
    --surface-2: rgba(255, 255, 255, 0.07);
    --field: rgba(255, 255, 255, 0.08);
    --field-hover: rgba(255, 255, 255, 0.15);
    --sheen: rgba(255, 255, 255, 0.08);
    --hi: rgba(255, 255, 255, 0.2);
    --edge: rgba(255, 255, 255, 0.14);
    --shadow: 0 14px 40px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.35);
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.45);
    --fg: #eef2f9;
    --muted: #a5b0c3;
    --line: rgba(255, 255, 255, 0.1);
    --line-strong: rgba(255, 255, 255, 0.22);
    --accent: #6e9cff;
    --accent-text: #8fb1ff;
    --accent-ink: #08101f;
    --accent-soft: rgba(110, 156, 255, 0.2);
    --ok: #5ed28e;
    --ok-soft: rgba(94, 210, 142, 0.17);
    --warn: #f0b659;
    --warn-soft: rgba(240, 182, 89, 0.17);
    --bad: #ff8c86;
    --bad-soft: rgba(255, 140, 134, 0.17);
    --bar: rgba(255, 255, 255, 0.22);
    --c1: #6e9cff;
    --c2: #43c6c8;
    --c3: #ea9160;
    --c4: #b0c25a;
    --c5: #c792db;
    --c6: #9faabf;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #080c14;
  --solid: #141a25;
  --orb1: rgba(255, 200, 40, 0.26);
  --orb2: rgba(60, 140, 255, 0.26);
  --orb3: rgba(255, 100, 90, 0.18);
  --orb4: rgba(60, 140, 255, 0.26);
  --surface: rgba(30, 37, 52, 0.55);
  --surface-strong: rgba(26, 32, 46, 0.8);
  --surface-2: rgba(255, 255, 255, 0.07);
  --field: rgba(255, 255, 255, 0.08);
  --field-hover: rgba(255, 255, 255, 0.15);
  --sheen: rgba(255, 255, 255, 0.08);
  --hi: rgba(255, 255, 255, 0.2);
  --edge: rgba(255, 255, 255, 0.14);
  --shadow: 0 14px 40px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.35);
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.45);
  --fg: #eef2f9;
  --muted: #a5b0c3;
  --line: rgba(255, 255, 255, 0.1);
  --line-strong: rgba(255, 255, 255, 0.22);
  --accent: #6e9cff;
  --accent-text: #8fb1ff;
  --accent-ink: #08101f;
  --accent-soft: rgba(110, 156, 255, 0.2);
  --ok: #5ed28e;
  --ok-soft: rgba(94, 210, 142, 0.17);
  --warn: #f0b659;
  --warn-soft: rgba(240, 182, 89, 0.17);
  --bad: #ff8c86;
  --bad-soft: rgba(255, 140, 134, 0.17);
  --bar: rgba(255, 255, 255, 0.22);
  --c1: #6e9cff;
  --c2: #43c6c8;
  --c3: #ea9160;
  --c4: #b0c25a;
  --c5: #c792db;
  --c6: #9faabf;
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button,
input,
select {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
h1,
h2,
h3,
p {
  margin: 0;
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
[hidden] {
  display: none !important;
}
.muted {
  color: var(--muted);
}
.mono {
  font-family: var(--mono);
  font-size: 12px;
}
.ell {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
svg.i {
  width: 20px;
  height: 20px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* colour field behind the glass */
.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(49% 44% at 9% 5%, var(--orb1), transparent 80%),
    radial-gradient(46% 41% at 93% 9%, var(--orb2), transparent 80%),
    radial-gradient(49% 44% at 87% 95%, var(--orb3), transparent 80%),
    radial-gradient(46% 41% at 5% 93%, var(--orb4), transparent 80%);
}

/* glass surfaces */
.card,
.side,
.login-card {
  background:
    linear-gradient(180deg, var(--sheen), transparent 46%), var(--surface);
  -webkit-backdrop-filter: blur(22px) saturate(170%);
  backdrop-filter: blur(22px) saturate(170%);
  border: 1px solid var(--edge);
  box-shadow:
    var(--shadow),
    inset 0 1px 0 var(--hi);
}
.card {
  border-radius: 24px;
  min-width: 0;
}
@supports not (
  (-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))
) {
  .card,
  .side,
  .login-card,
  .modal {
    background: var(--solid);
  }
}

/* shell */
.app,
.login {
  position: relative;
  z-index: 1;
}
.app {
  display: grid;
  grid-template-columns: 256px minmax(0, 1fr);
  min-height: 100vh;
}
.side {
  position: sticky;
  top: 12px;
  height: calc(100vh - 24px);
  height: calc(100dvh - 24px);
  margin: 12px;
  align-self: start;
  display: flex;
  flex-direction: column;
  gap: 22px;
  padding: 20px 12px;
  border-radius: 28px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 10px;
  font-weight: 700;
  font-size: 18px;
  letter-spacing: -0.01em;
}
.brand svg {
  width: 22px;
  height: 22px;
  fill: var(--accent);
  filter: drop-shadow(
    0 2px 6px color-mix(in srgb, var(--accent) 45%, transparent)
  );
}
.brand span {
  font-weight: 500;
  color: var(--muted);
}
.nav {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.nav button {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 10px 14px;
  border: 1px solid transparent;
  border-radius: 16px;
  background: none;
  color: var(--muted);
  font-weight: 500;
  text-align: left;
  transition:
    background 0.15s,
    color 0.15s;
}
.nav button:hover {
  background: var(--field);
  color: var(--fg);
}
.nav button[aria-current="page"] {
  background: var(--accent-soft);
  border-color: var(--edge);
  box-shadow: inset 0 1px 0 var(--hi);
  color: var(--accent-text);
  font-weight: 600;
}
.side-foot {
  margin-top: auto;
  padding: 0 10px;
  font-size: 12px;
  color: var(--muted);
  text-align: center;
}
.main {
  padding: 28px clamp(16px, 3vw, 36px) 56px 8px;
  width: 100%;
  max-width: 2200px;
  min-width: 0;
}
.page-head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px 20px;
  margin-bottom: 22px;
}
.page-head h1 {
  font-size: 28px;
  line-height: 1.2;
  letter-spacing: -0.025em;
  font-weight: 700;
  text-wrap: balance;
}
.page-head .sub {
  margin-top: 4px;
  color: var(--muted);
}
.head-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

/* controls */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 9px 16px;
  border: 1px solid var(--edge);
  border-radius: 999px;
  background: var(--field);
  box-shadow:
    var(--shadow-sm),
    inset 0 1px 0 var(--hi);
  font-weight: 600;
  white-space: nowrap;
  transition:
    background 0.15s,
    transform 0.1s;
}
.btn:hover {
  background: var(--field-hover);
}
.btn:active {
  transform: scale(0.98);
}
.btn.primary {
  border-color: transparent;
  background: linear-gradient(
    180deg,
    color-mix(in srgb, var(--accent) 80%, #fff),
    var(--accent)
  );
  color: var(--accent-ink);
  box-shadow:
    0 6px 18px color-mix(in srgb, var(--accent) 36%, transparent),
    inset 0 1px 0 rgba(255, 255, 255, 0.5);
}
.btn.primary:hover {
  filter: brightness(1.07);
  background: linear-gradient(
    180deg,
    color-mix(in srgb, var(--accent) 80%, #fff),
    var(--accent)
  );
}
.btn.ghost {
  border-color: transparent;
  background: none;
  box-shadow: none;
  color: var(--muted);
}
.btn.ghost:hover {
  background: var(--field);
  color: var(--fg);
}
.btn.sm {
  padding: 6px 12px;
  font-size: 13px;
}
.btn svg.i {
  width: 18px;
  height: 18px;
}
.btn[disabled] {
  opacity: 0.3;
  cursor: default;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border: 1px solid var(--edge);
  border-radius: 999px;
  background: var(--field);
  box-shadow:
    var(--shadow-sm),
    inset 0 1px 0 var(--hi);
  font-weight: 500;
  color: var(--muted);
}
.chip:hover {
  color: var(--fg);
  background: var(--field-hover);
}
.chip[aria-pressed="true"] {
  background: var(--accent-soft);
  color: var(--accent-text);
  font-weight: 600;
}
.chip b {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.seg {
  display: inline-flex;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--edge);
  border-radius: 999px;
  background: var(--field);
  box-shadow:
    inset 0 1px 2px rgba(0, 0, 0, 0.06),
    inset 0 1px 0 var(--hi);
}
.seg button {
  border: 0;
  border-radius: 999px;
  background: none;
  padding: 6px 14px;
  font-weight: 600;
  color: var(--muted);
}
.seg button[aria-pressed="true"] {
  background: var(--surface-strong);
  color: var(--accent);
  box-shadow:
    var(--shadow-sm),
    inset 0 1px 0 var(--hi);
}
input,
select {
  width: 100%;
  min-width: 0;
  padding: 10px 13px;
  border: 1px solid var(--line-strong);
  border-radius: 14px;
  background: var(--field);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.05);
}
input[type="checkbox"] {
  width: 18px;
  height: 18px;
  flex: none;
  accent-color: var(--accent);
}
select.inline {
  width: auto;
}
.search {
  position: relative;
  flex: 1 1 240px;
  max-width: 360px;
}
.search svg {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  color: var(--muted);
}
.search input {
  padding-left: 38px;
  border-radius: 999px;
}

/* cards, lists */
.card-h {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 18px 20px 0;
}
.card-h h2 {
  font-size: 15px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-b {
  padding: 10px 20px 18px;
}
.stack {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-width: 0;
}
.cols {
  display: grid;
  grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
  gap: 16px;
  align-items: start;
}
.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px;
  margin-bottom: 16px;
}
.kpi {
  padding: 18px 20px;
}
.kpi .label {
  color: var(--muted);
  font-size: 13px;
}
.kpi .val {
  margin-top: 2px;
  font-size: 30px;
  line-height: 1.25;
  font-weight: 600;
  letter-spacing: -0.025em;
  font-variant-numeric: tabular-nums;
}
.kpi .val small {
  font-size: 15px;
  font-weight: 500;
  color: var(--muted);
}
.kpi .note {
  margin-top: 2px;
  font-size: 12.5px;
  color: var(--muted);
}
.kpi.alert .val {
  color: var(--warn);
}
.item {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 12px 0;
  border-top: 1px solid var(--line);
}
.item:first-child {
  border-top: 0;
}
.item .grow {
  flex: 1;
  min-width: 0;
}
.item .title {
  font-weight: 600;
}
.item .acts {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 8px;
}
.ico {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 12px;
  flex: none;
  box-shadow: inset 0 1px 0 var(--hi);
}
.ico.bad {
  background: var(--bad-soft);
  color: var(--bad);
}
.ico.warn {
  background: var(--warn-soft);
  color: var(--warn);
}
.ico.ia {
  background: var(--accent-soft);
  color: var(--accent);
}
.ico.ok {
  background: var(--ok-soft);
  color: var(--ok);
}
.empty {
  padding: 22px 0;
  text-align: center;
  color: var(--muted);
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  white-space: nowrap;
  background: var(--surface-2);
  color: var(--muted);
  box-shadow: inset 0 1px 0 var(--hi);
}
.pill.dot::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
}
.pill.ok {
  background: var(--ok-soft);
  color: var(--ok);
}
.pill.warn {
  background: var(--warn-soft);
  color: var(--warn);
}
.pill.bad {
  background: var(--bad-soft);
  color: var(--bad);
}
.pill.accent {
  background: var(--accent-soft);
  color: var(--accent-text);
}
.netbar {
  display: flex;
  height: 12px;
  border-radius: 999px;
  overflow: hidden;
  background: var(--surface-2);
  margin: 8px 0 12px;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.08);
}
.netbar i {
  display: block;
  height: 100%;
}
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 18px;
  color: var(--muted);
  font-size: 13px;
}
.legend b {
  color: var(--fg);
  font-variant-numeric: tabular-nums;
}
.legend span::before {
  content: "";
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 6px;
  background: var(--lc);
}
.banner,
.note {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 13px 18px;
  margin-bottom: 16px;
  border-radius: 20px;
  border: 1px solid var(--edge);
  box-shadow:
    var(--shadow-sm),
    inset 0 1px 0 var(--hi);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  backdrop-filter: blur(18px) saturate(160%);
}
.banner {
  background: var(--warn-soft);
  color: var(--warn);
}
.banner p {
  flex: 1 1 260px;
  color: var(--fg);
}
.note {
  align-items: flex-start;
  flex-wrap: nowrap;
  background: var(--accent-soft);
}
.note p {
  color: var(--fg);
}
.note svg {
  color: var(--accent);
  margin-top: 2px;
}

/* screens table */
.tools {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  margin-bottom: 14px;
}
.tools .rep-seg {
  margin-left: auto;
  flex: none;
}
.tools.rep-dates {
  margin-top: -4px;
}
@media (min-width: 440px) and (max-width: 1100px) {
  .page-head {
    flex-wrap: nowrap;
    align-items: flex-start;
  }
  .page-head > div:first-child {
    flex: 1 1 0;
    min-width: 0;
  }
  .page-head .head-actions {
    flex: none;
    flex-wrap: nowrap;
    justify-content: flex-end;
    max-width: 100%;
  }
  .head-actions > .btn.primary {
    flex: 0 1 auto;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
  }
}
@media (min-width: 440px) and (max-width: 560px) {
  .page-head {
    gap: 10px;
  }
  .page-head h1 {
    font-size: 22px;
  }
  .page-head .head-actions {
    gap: 6px;
  }
  .page-head .head-actions .bellbtn {
    padding-inline: 10px;
  }
  .page-head .head-actions .btn {
    padding: 9px 13px;
    font-size: 14px;
  }
}
@media (max-width: 760px) {
  .head-actions {
    flex-wrap: nowrap;
    justify-content: flex-start;
  }
  .head-actions > .btn {
    flex: 0 0 auto;
    min-width: 0;
  }
  .head-actions > .btn.primary {
    flex: 0 1 auto;
    overflow: hidden;
  }
  .head-actions > .btn.primary {
    white-space: nowrap;
  }
  .tools.rep-tools,
  .tools.rep-dates {
    justify-content: center;
  }
  .tools.rep-tools .field-inline,
  .tools.rep-dates .field-inline {
    justify-content: center;
  }
  .tools .rep-seg {
    margin-left: 0;
  }
  #view > .chips,
  #view > .tools {
    justify-content: center;
  }
  #view > .hint,
  #view > p.hint {
    text-align: center;
  }
  #view > .tools .hint {
    width: 100%;
    text-align: center;
  }
  #view > .tools .field-inline {
    justify-content: center;
  }
}
@media (min-width: 761px) {
  .tools.rep-tools {
    flex-wrap: nowrap;
  }
  .rep-tools .field-inline {
    flex: 0 1 auto;
  }
  .rep-tools #rep-camp {

  gap: 6px;

  background: var(--surface-2);

    background 0.15s,
    border-color 0.15s;

}

}

}
.tile {

}

}

/* modal */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  padding: 16px;
  overflow: auto;
  background: rgba(8, 12, 22, 0.42);
}
.modal {
  margin: auto;
  width: min(640px, 100%);
  border-radius: 30px;
  border: 1px solid var(--edge);
  background:
    linear-gradient(180deg, var(--sheen), transparent 40%),
    var(--surface-strong);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  backdrop-filter: blur(30px) saturate(180%);
  box-shadow:
    0 30px 80px rgba(8, 14, 32, 0.3),
    inset 0 1px 0 var(--hi);
  animation: pop 0.22s ease-out;
}

    transform: none;

.code {

  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.06);
  margin: 14px 0;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 16px);
  z-index: 70;
  max-width: calc(100vw - 32px);

  border-radius: 999px;
  background: color-mix(in srgb, var(--fg) 90%, transparent);
  color: var(--bg);
  font-weight: 500;
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  box-shadow: var(--shadow);
  opacity: 0;
  pointer-events: none;
  transition:
    opacity 0.2s,
    transform 0.2s;

.poi-box {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px 12px;
  font-size: 13px;
}
.poi-box .muted {
  flex: 1 1 200px;
  min-width: 0;
}
.cal-card .card-h {
  padding-bottom: 6px;
}
.cal-card .card-b {
  padding-top: 6px;
}
.cal-row {
  padding: 6px 0;
  border-bottom: 1px solid var(--line);
}
.cal-row:last-of-type {
  border-bottom: 0;
}
.cal-top {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  min-width: 0;
}
.cal-top .grow {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.cal-plus {
  flex: 0 0 auto;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--accent);
  font-size: 16px;
  line-height: 1;
  cursor: pointer;
  padding: 0;
}
.cal-det {
  margin: 6px 0 2px 32px;
  font-size: 13px;
  display: grid;
  gap: 2px;
}
.cal-info {
  margin: 6px 0 0;
  font-size: 12px;
}
.cal-kw {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  font-size: 12px;
  color: var(--muted);
}
.cal-kw input {
  flex: 1;
  min-width: 0;
  padding: 4px 10px;
  font-size: 12px;
}
.few-ctl {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 13px;
}
.few-ctl input {
  width: 64px;
  padding: 5px 8px;
  text-align: center;
  border-radius: 999px;
}
.lim-in {
  width: 64px;
  padding: 5px 8px;
  text-align: center;
  border-radius: 999px;
  font-variant-numeric: tabular-nums;
}
.pl-head {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 8px 16px;
  margin-bottom: 10px;
}
.pl-limit {
  display: flex;
  align-items: center;
  gap: 10px;
}
.pl-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  margin-bottom: 6px;
  border: 1px solid var(--edge);
  border-radius: 18px;
  background: var(--field);
  box-shadow:
    var(--shadow-sm),
    inset 0 1px 0 var(--hi);
}
.pl-item.on {
  border-color: color-mix(in srgb, var(--ok) 45%, transparent);
}
.pl-item.limit {
  opacity: 0.55;
  border-style: dashed;
}
.pl-item .grow {
  flex: 1;
  min-width: 0;
}
.pl-item small {
  display: block;
}
.pl-group {
  margin-bottom: 6px;
  padding: 8px;
  border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  border-radius: 22px;
  background: var(--accent-soft);
}
.pl-ghead {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 2px 6px 4px;
}
.pl-ghead .grow {
  flex: 1;
  min-width: 0;
}
.pl-ghead small {
  display: block;
}
.pl-gm .pl-item {
  margin: 6px 0 0;
  box-shadow: none;
}
.pl-n {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  flex: none;
  border-radius: 50%;
  background: var(--surface-2);
  font-size: 12px;
  font-weight: 600;
  box-shadow: inset 0 1px 0 var(--hi);
}
.pl-btns {
  display: flex;
  gap: 2px;
}
.pl-btns .btn {
  padding: 5px 8px;
}
.pl-cut {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 10px 0;
  color: var(--warn);
  font-size: 12.5px;
  font-weight: 600;
}
.pl-cut::before,
.pl-cut::after {
  content: "";
  flex: 1;
  border-top: 1.5px dashed var(--warn);
}
.perms {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 12px 18px;
  padding: 14px;
  border: 1px solid var(--line-strong);
  border-radius: 18px;
  background: var(--field);
}
.pgroup {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.pgroup label,
.row-check {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-weight: 500;
  font-size: 13.5px;
}
.pgroup input,
.row-check input {
  margin-top: 3px;
}
.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.avatar.lg {
  width: 72px;
  height: 72px;
  font-size: 28px;
}
.avatar.xs {
  width: 26px;
  height: 26px;
  font-size: 12px;
}
button.avatar {
  border: 0;
  padding: 0;
  cursor: pointer;
}
.photo-row {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.photo-row .btn {
  margin: 0 6px 6px 0;
}
.avatar {
  display: grid;
  overflow: hidden;
  place-items: center;
  width: 38px;
  height: 38px;
  flex: none;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent-text);
  font-weight: 700;
  box-shadow: inset 0 1px 0 var(--hi);
}
.foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-top: 36px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 13px;
}
.foot .sp {
  flex: 1;
}
.who-in {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
@media (max-width: 700px) {
  .foot {
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    text-align: center;
    padding-bottom: 84px;
  }
  .foot #who {
    flex: 1 1 100%;
  }
  .foot .sp {
    display: none;
  }
  .foot > span:not(.sp):not(#who) {
    display: none;
  }
}
.seg.sm button {
  padding: 4px 11px;
  font-size: 13px;
}
.seg.sm button .i {
  width: 16px;
  height: 16px;
  display: block;
}

/* playlist em loop + pré-visualização */
.pl-strip {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 14px;
  padding: 10px 14px;
  margin-bottom: 10px;
  border-radius: 18px;
  background: var(--accent-soft);
  box-shadow: inset 0 1px 0 var(--hi);
  font-size: 13.5px;
}
.pl-draft {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 10px;
  padding: 12px 14px;
  margin-bottom: 12px;
  border-radius: 18px;
  border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent);
  background: var(--warn-soft);
  box-shadow: inset 0 1px 0 var(--hi);
}
.pl-draft > svg {
  color: var(--warn);
  flex: none;
}
.pl-draft p {
  flex: 1 1 200px;
  color: var(--fg);
  font-weight: 600;
}
.pl-warn {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  flex-wrap: wrap;
  padding: 10px 14px;
  margin-bottom: 8px;
  border-radius: 16px;
  background: var(--warn-soft);
  color: var(--fg);
  font-size: 13.5px;
}
.pl-warn > svg {
  color: var(--warn);
  flex: none;
  margin-top: 2px;
}
.pl-warn > span {
  flex: 1 1 220px;
}
.pl-warn.info {
  background: var(--surface-2);
}
.pl-warn.info > svg {
  color: var(--muted);
}
.pl-slot {
  font-variant-numeric: tabular-nums;
}
.pv-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 12px;
}
.pv-stage {
  position: relative;
  overflow: hidden;
  border-radius: 18px;
  background: #0b0f1a;
  color: #fff;
  box-shadow:
    var(--shadow),
    inset 0 0 0 1px rgba(255, 255, 255, 0.14);
}
.pv-face {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8%;
  text-align: center;
  overflow: hidden;
}
.pv-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.9;
}
.pv-face .nm,
.pv-face .cl {
  position: relative;
  text-shadow: 0 2px 14px rgba(0, 0, 0, 0.5);
}
.pv-face .nm {
  font-size: clamp(16px, 4.4vw, 34px);
  font-weight: 700;
  letter-spacing: -0.02em;
}
.pv-face .cl {
  opacity: 0.88;
  font-size: clamp(12px, 2.2vw, 16px);
}
.pv-badge,
.pv-time {
  position: absolute;
  top: 10px;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.42);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}
.pv-badge {
  left: 10px;
}
.pv-time {
  right: 10px;
}
.pv-bar {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 5px;
  background: rgba(255, 255, 255, 0.22);
}
.pv-bar i {
  display: block;
  height: 100%;
  width: 0;
  background: #fff;
  transition: width 1s linear;
}
.pv-ctl {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 12px;
}
.pv-line {
  display: flex;
  gap: 3px;
  margin: 6px 0;
}
.pv-line span {
  min-width: 0;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  background: var(--bc);
  color: var(--accent-ink);
  font-size: 12px;
  font-weight: 700;
  opacity: 0.5;
  transition: opacity 0.2s;
}
.pv-line span.cur {
  opacity: 1;
  box-shadow:
    0 0 0 2px var(--surface-strong),
    0 0 0 4px var(--fg);
}

.kpi .note {
  display: block;
  margin: 2px 0 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: none;
  box-shadow: none;
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}
@media (max-width: 900px) {
  .kpis {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }
  .kpi {
    padding: 14px 16px;
  }
  .kpi .val {
    font-size: 26px;
  }
}
/* conteúdos, pastas, vários vídeos por campanha, localização */
.pills {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.pill-x {
  display: inline-grid;
  place-items: center;
  margin: 0 -6px 0 2px;
  padding: 6px;
  border: 0;
  border-radius: 50%;
  background: none;
  color: inherit;
  opacity: 0.7;
}
.pill-x:hover {
  opacity: 1;
  background: rgba(0, 0, 0, 0.08);
}
.pill-x svg {
  width: 12px;
  height: 12px;
}
.chips .chip svg {
  width: 15px;
  height: 15px;
}
.tile-b select {
  margin-top: 6px;
}
.checks.ci-list {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 10px;
  max-height: 260px;
}
.ci-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px 10px;
}
.ci-main {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  flex: 1 1 220px;
}
.ci-main small {
  white-space: nowrap;
}
.ci-win {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
  flex: 1 1 100%;
}
.ci-line {
  display: flex;
  align-items: center;
  gap: 6px;
}
.ci-list:not([data-manual]) .ci-pos {
  display: none;
}
.ci-order {
  margin: 4px 0 8px;
}
.ci-line input[type="number"] {
  width: 72px;
  padding: 6px 10px;
  font-size: 13px;
  border-radius: 999px;
}
@media (max-width: 700px) {
  .ci-win {
    align-items: stretch;
  }
  .ci-line {
    flex-wrap: wrap;
  }
  .ci-line input[type="date"] {
    flex: 1 1 120px;
    min-width: 0;
  }
  .ci-line select {
    flex: 1 1 90px;
  }
  .checks.ci-list {
    max-height: 380px;
  }
}
.ci-line small {
  color: var(--muted);
  min-width: 38px;
}
.iv-box {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
}
.ci-hours {
  align-items: flex-start;
}
.ci-hours .iv-box {
  align-items: flex-end;
}
.iv-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.iv-row {
  display: flex;
  align-items: center;
  gap: 6px;
}
.iv-row select {
  width: auto;
}
.iv-list:not(.multi) .iv-del {
  display: none;
}
.iv-del {
  padding: 4px 6px;
}
.iv-del svg {
  width: 14px;
  height: 14px;
}
.iv-camp .iv-row select {
  padding: 8px 12px;
}
.warn-t {
  color: var(--warn);
  font-weight: 600;
}
.more-hint {
  margin-top: 6px;
}
.more-hint summary {
  cursor: pointer;
  color: var(--accent);
  font-weight: 600;
}
.more-hint[open] summary {
  margin-bottom: 4px;
}
@media (max-width: 700px) {
  .ci-win,
  .ci-hours,
  .ci-hours .iv-box,
  .ci-hours .iv-list,
  .ci-hours .iv-row {
    min-width: 0;
    max-width: 100%;
  }
  .ci-hours {
    flex-wrap: wrap;
  }
  .ci-hours .iv-box {
    flex: 1 1 100%;
    align-items: stretch;
  }
  .ci-hours .iv-list {
    width: 100%;
  }
  .ci-hours .iv-row select {
    flex: 1 1 0;
    min-width: 0;
  }
  .ci-hours .iv-add {
    align-self: flex-end;
  }
  .iv-camp .iv-row select {
    flex: 1 1 0;
    min-width: 0;
  }
}
.ci-line input[type="date"] {
  width: auto;
  padding: 6px 10px;
  font-size: 13px;
  border-radius: 999px;
}
.ci-win select {
  width: auto;
  padding: 6px 10px;
  font-size: 13px;
  border-radius: 999px;
}
.field-inline input {
  width: auto;
  border-radius: 999px;
}
.pv-face .fl {
  position: relative;
  margin-top: 8px;
  padding: 2px 10px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.42);
  font-size: 11.5px;
  max-width: 90%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.facts dd a {
  color: var(--accent);
  font-weight: 600;
}

@media (max-width: 1000px) {
  .cols {
    grid-template-columns: minmax(0, 1fr);
  }
}
@media (max-width: 900px) {
  .app {
    grid-template-columns: minmax(0, 1fr);
  }
  .side {
    position: fixed;
    inset: auto 0 0 0;
    top: auto;
    height: auto;
    margin: 0;
    flex-direction: row;
    gap: 0;
    padding: 0 12px calc(10px + env(safe-area-inset-bottom, 0px));
    border: 0;
    border-radius: 0;
    background: none;
    box-shadow: none;
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
    z-index: 40;
  }
  .brand,
  .side-foot {
    display: none;
  }
  .nav {
    flex-direction: row;
    width: 100%;
    gap: 2px;
    padding: 6px;
    border-radius: 28px;
    border: 1px solid var(--edge);
    background:
      linear-gradient(180deg, var(--sheen), transparent 46%),
      var(--surface-strong);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    box-shadow:
      var(--shadow),
      inset 0 1px 0 var(--hi);
  }
  .nav button {
    flex: 1;
    min-width: 0;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 2px;
    padding: 7px 0;
    border-radius: 22px;
    font-size: 10px;
    letter-spacing: -0.01em;
    text-align: center;
  }
  .main {
    padding: 20px 16px 112px;
  }
  .toast {
    bottom: calc(98px + env(safe-area-inset-bottom, 0px));
  }
  .t-row {
    grid-template-columns: minmax(0, 1fr) auto;
  }
  .hm {
    display: none;
  }
  .page-head h1 {
    font-size: 24px;
  }
}

/* ---------- telemóvel: acabamentos (v60) ---------- */
@media (max-width: 900px) {
  .kpi .label {
    min-height: 2.7em;
  }
}
@media (max-width: 760px) {
  .t-row .ell {
    white-space: normal;
    overflow: visible;
    text-overflow: clip;
  }
  .t-row {
    align-items: start;
  }
  .t-row > span:last-child {
    margin-top: 2px;
  }
  .cal {
    min-width: 0;
    padding: 0 10px;
  }
  .dh {
    padding: 8px 0;
  }
  .dh span {
    font-size: 9px;
    letter-spacing: -0.01em;
    max-width: 100%;
    overflow: hidden;
  }
  .crow {
    grid-template-columns: repeat(7, minmax(0, 1fr));
  }
  .crow .clabel,
  .chead .hint {
    grid-column: 1/-1;
  }
  .chead .hint {
    padding: 10px 4px 0;
    font-size: 12px;
  }
  .clabel {
    padding: 12px 4px 2px;
  }
  .clabel strong {
    flex-wrap: wrap;
    row-gap: 4px;
  }
  .clabel strong .ell {
    max-width: 100%;
    white-space: normal;
    overflow: visible;
  }
  .cell {
    height: 30px;
  }
  .cell i {
    top: 8px;
    height: 13px;
  }
  .cal-wrap {
    overflow-x: visible;
  }
  .gallery {
    grid-template-columns: minmax(0, 1fr);
    gap: 10px;
  }
  .tile {
    display: grid;
    grid-template-columns: 96px minmax(0, 1fr);
  }
  .tile .thumb {
    aspect-ratio: auto;
    height: 100%;
    min-height: 96px;
  }
  .tile .thumb svg.i {
    width: 28px;
    height: 28px;
  }
  .tile .thumb .tag {
    left: 6px;
    top: 6px;
    padding: 0 7px;
    font-size: 10px;
  }
  .tile-b {
    padding: 10px 12px;
    min-width: 0;
  }
  .tile-b .btn.sm,
  .tile-sel,
  .tile-b select {
    font-size: 12.5px;
    padding: 6px 10px;
  }
  .tile-b > .btn.sm.ghost {
    width: 100%;
    margin-top: 6px;
    border: 1px solid var(--line-strong);
    border-radius: 14px;
    background: var(--field);
    justify-content: flex-start;
    font-weight: 500;
  }
  .tbl {
    min-width: 520px;
  }
  .tbl th,
  .tbl td {
    padding: 10px 12px;
  }
  .tbl td:first-child,
  .tbl th:first-child {
    position: sticky;
    left: 0;
    z-index: 1;
    background: var(--surface-strong);
  }
  .tbl td .muted,
  .tbl td small {
    font-size: 12px;
    line-height: 1.35;
  }
  .tbl td:first-child {
    min-width: 132px;
    max-width: 170px;
  }
  .item .acts .btn.ghost {
    padding-inline: 4px;
  }
  .tbl-camp {
    min-width: 0;
  }
  .tbl-camp th:nth-child(5),
  .tbl-camp td:nth-child(5) {
    display: none;
  }
  .tbl-camp td:first-child {
    min-width: 0;
    max-width: none;
  }
  .tbl-camp th,
  .tbl-camp td {
    padding-inline: 8px;
  }
  .tbl-camp th {
    font-size: 11px;
    letter-spacing: 0;
  }
  .u-item {
    flex-wrap: wrap;
  }
  .u-item .grow {
    flex: 1 1 calc(100% - 52px);
  }
  .u-side {
    flex-direction: row !important;
    flex-wrap: wrap;
    align-items: center !important;
    margin-left: 50px;
    width: calc(100% - 50px);
  }
  .sec-item {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    column-gap: 12px;
  }
  .sec-item > .pill {
    grid-column: 2;
    justify-self: start;
    margin-top: 6px;
  }
  .acct-item {

function sugHtml(g, cCamp, cSee, cRep) {

  const open = cCamp ? '<button class="btn sm" data-a="edit-camp" data-id="' + (g.c ? g.c.id : '') + '">Abrir campanha</button>' : '';
  let ico = 'spark', cls = 'ia', title = '', txt = '', acts = '';
  if (g.kind === 'start') {
    ico = 'alert'; cls = 'warn'; title = '«' + esc(g.c.name) + '» começa ' + whenTxt(g.c.start); txt = esc(g.why);
    acts = open + (cCamp ? ig : '');
  } else if (g.kind === 'end') {
    ico = 'calendar'; cls = 'warn'; title = '«' + esc(g.c.name) + '» termina ' + whenTxt(g.c.end);
    txt = esc(g.c.client) + ' · passa em ' + playScreens(g.c).length + (playScreens(g.c).length === 1 ? ' ecrã' : ' ecrãs') + '. Prolongue ou prepare a campanha seguinte.';
    acts = (cCamp ? '<button class="btn sm primary" data-a="extend" data-id="' + g.c.id + '">Prolongar 7 dias</button>' : '') + open + (cCamp ? ig : '');
  } else if (g.kind === 'vend') {
    ico = 'calendar'; cls = 'warn'; title = 'Vídeo a sair: «' + esc(g.f ? g.f.name : '—') + '»';
    txt = 'Sai da campanha «' + esc(g.c.name) + '» ' + whenTxt(g.d1) + '. ' + (g.left ? (g.left === 1 ? 'Continua 1 vídeo.' : 'Continuam ' + g.left + ' vídeos.') : 'Depois disso a campanha fica sem vídeo.');
    acts = open + (cCamp ? ig : '');
  } else if (g.kind === 'final') {
    ico = 'download'; cls = 'ok'; title = 'Relatório final de «' + esc(g.c.name) + '»';
    txt = 'A campanha terminou ' + (g.ago <= 0 ? 'hoje' : (g.ago === 1 ? 'ontem' : 'há ' + g.ago + ' dias')) + '. Gere o relatório para enviar a ' + esc(g.c.client) + '. Este aviso desaparece 24 horas depois de aparecer.';
    acts = (cRep ? '<button class="btn sm primary" data-a="final-report" data-id="' + g.c.id + '">Gerar relatório</button>' : '') + ig;
  } else if (g.kind === 'clean') {
    const n = g.list.length;
    ico = 'folder'; cls = 'warn'; title = n === 1 ? 'Conteúdo sem uso vai ser apagado: «' + esc(g.list[0].name) + '»' : n + ' conteúdos sem uso vão ser apagados';
    txt = g.list.slice(0, 3).map(f=>'«' + esc(f.name) + '» ' + daysTxt(leftDays(f))).join(' · ') + (n > 3 ? ' e mais ' + (n - 3) : '') + '. Primeiro vão para a reciclagem, onde ficam ' + state.clean.bin + ' dias e podem ser restaurados.';
    acts = '<button class="btn sm primary" data-a="keep-all">' + (n === 1 ? 'Manter' : 'Manter todos') + '</button><button class="btn sm" data-a="clean-see">Ver conteúdos</button>' + (cCamp ? ig : '');
  } else if (g.kind === 'few') {
    ico = 'monitor'; cls = 'ia'; title = 'Poucas campanhas: ' + esc(g.venue);
    txt = (g.screens.length === 1 ? 'O ecrã «' + esc(g.screens[0].spot) + '» tem' : g.screens.length + ' ecrãs têm') + ' só ' + g.n + (g.n === 1 ? ' campanha ativa' : ' campanhas ativas') + ' (aviso abaixo de ' + state.fewMin + '). Há espaço para vender: passe ao comercial.';
    acts = (cSee ? '<button class="btn sm" data-a="open-screen" data-id="' + g.screens[0].id + '">Ver ecrã</button>' : '') + ig;
  } else {
    title = 'Mais audiência para «' + esc(g.c.name) + '»';
    txt = 'Passar de ' + hrs(g.c.h0, g.c.h1) + ' para ' + hrs(g.b.h0, g.b.h1) + ' dá cerca de +' + Math.round(g.b.gain * 100) + ' % de visualizações estimadas.';
    acts = (cCamp ? '<button class="btn sm primary" data-a="apply-opt" data-id="' + g.id + '">Aplicar</button>' + ig : '');
  }
  return '<div class="item"><span class="ico ' + cls + '">' + ic(ico) + '</span><div class="grow"><div class="title">' + title + '</div><div class="muted">' + txt + '</div>' + (acts ? '<div class="acts">' + acts + '</div>' : '') + '</div></div>';
}

function can(p) {const u = state.user; return !!u && (u.admin || u.perms.indexOf(p) > -1);}
const sameSet = (a, b)=>a.length === b.length && a.every(x=>b.indexOf(x) > -1);
function roleName(u) {
  if (u.admin) return 'Administrador';
  if (sameSet(u.perms, ROLES['Operador'])) return 'Operador';
  if (sameSet(u.perms, ROLES['Só consulta'])) return 'Só consulta';

}
function accessInfo(u) {
  if (!u.active) return {t:'Conta desativada', c:'bad'};

  if (u.until) return {t:'Acesso até ' + dShort.format(u.until), c:'warn'};
  return {t:'Sem limite de data', c:'ok'};
}

function readPhoto(file, done, fail) {
  if (!file || !/^image\//.test(file.type || '')) {fail('Escolha um ficheiro de imagem (JPG ou PNG).'); return;}
  if (file.size > 15 * 1024 * 1024) {fail('A imagem é demasiado grande. Escolha uma com menos de 15 MB.'); return;}
  const fr = new FileReader();
  fr.onerror = function() {fail('Não foi possível ler a imagem.');};
  fr.onload = function() {
    const im = new Image();
    im.onerror = function() {fail('Não foi possível abrir a imagem. Tente um JPG ou PNG.');};
    im.onload = function() {
      try {
        const n = 256, cv = document.createElement('canvas'); cv.width = n; cv.height = n;
        const side = Math.min(im.width, im.height), sx = (im.width - side) / 2, sy = (im.height - side) / 2;
        const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, n, n); x.drawImage(im, sx, sy, side, side, 0, 0, n, n);
        done(cv.toDataURL('image/jpeg', 0.85));
      } catch (e) {fail('Não foi possível processar a imagem.');}
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---------- ecrãs ---------- */
function plState(c, s, L, h) {

  if (!screenOn(s, h)) return ['off', 'Ecrã desligado', ''];
  if (!onAt(c, today, h, s)) return ['off', (function() {const v = civs(c), nx = v.find(x=>x[0] > h), pv = v.filter(x=>x[1] <= h).pop(); return inIvs(v, h) ? 'Sem vídeo a esta hora' : (nx ? 'Entra às ' + nx[0] + 'h' : (pv ? 'Saiu às ' + pv[1] + 'h' : 'Sem vídeo a esta hora'));})(), ''];
  if (L.out.indexOf(c) > -1) return ['limit', 'Fora do limite agora', 'warn'];

}

        if (it._a[q] === '' || it._b[q] === '' || isNil(it._a[q]) || isNil(it._b[q])) return {err:'«' + nm + '»: com mais do que um intervalo, escolha a hora de início e de fim de cada um.'};
        if (+it._b[q] <= +it._a[q]) return {err:'«' + nm + '»: em cada intervalo, a hora de fim tem de ser depois da de início.'};
        raw.push([+it._a[q], +it._b[q]]);
      }
      const m = mergeIvs(raw);
      if (m.over)warns.push('«' + nm + '»: intervalos sobrepostos juntados em ' + ivTxt(m.list) + '.');
      it.h0 = m.list[0][0]; it.h1 = m.list[m.list.length - 1][1];
      if (m.list.length > 1)it.ivs = m.list;
    }
    delete it._pr; delete it._a; delete it._b;
  }
  const manual = fd.get('order') === 'manual';
  if (manual && items.length > 1) {
    const pos = {};
    for (let k = 0; k < items.length; k++) {
      const f = fileById(items[k].f), v = String(fd.get('cio_' + items[k].f) || '').trim(), n = Math.round(+v);
      if (!v || !(n >= 1 && n <= 99)) return {err:'Indique a posição de «' + f.name + '» na ordem (1, 2, 3…).'};
      if (pos[n]) return {err:'«' + fileById(pos[n]).name + '» e «' + f.name + '» têm a mesma posição (' + n + '). Cada vídeo precisa de uma posição diferente.'};
      pos[n] = items[k].f; items[k].pos = n;
    }
    items.sort((p, q)=>p.pos - q.pos); items.forEach(function(i) {delete i.pos;});
  }
  for (let k = 0; k < items.length; k++) {
    const it = items[k], f = fileById(it.f), w0 = isNil(it.h0) ? ch0 : it.h0, w1 = isNil(it.h1) ? ch1 : it.h1;
    const mine = (it.ivs && it.ivs.length) ? it.ivs : [[w0, w1]], full = cv.length === 1 || (it.ivs && it.ivs.length) || (!isNil(it.h0) && !isNil(it.h1));
    if (w1 <= w0) return {err:'O vídeo «' + f.name + '» tem de acabar depois de começar.'};
    if (full && !mine.every(v=>cv.some(x=>v[0] >= x[0] && v[1] <= x[1]))) return {err:'O horário de «' + f.name + '» tem de ficar dentro do horário da campanha (' + ivTxt(cv) + ').'};
    if (!itemIvs({ivs:cv.length > 1 ? cv : null, h0:ch0, h1:ch1}, it).length) return {err:'O horário de «' + f.name + '» não coincide com nenhum intervalo da campanha (' + ivTxt(cv) + ').'};
    if ((it.d0 && it.d0 < cs) || (it.d1 && it.d1 > ce) || (it.d0 && it.d0 > ce) || (it.d1 && it.d1 < cs)) return {err:'Os dias de «' + f.name + '» têm de ficar dentro das datas da campanha (' + dShort.format(cs) + ' a ' + dShort.format(ce) + ').'};
    if (it.d0 && it.d1 && it.d1 < it.d0) return {err:'O vídeo «' + f.name + '» tem de sair no mesmo dia ou depois de entrar.'};
  }
  const tmp = {h0:ch0, h1:ch1, ivs:cv.length > 1 ? cv : null, start:cs, end:ce, items:items}, w = winsOf(tmp, null).filter(x=>x.f), pp = {};
  items.forEach(function(i) {pp[i.f] = i.ppm;});
  for (let i = 0; i < w.length; i++) for (let j = i + 1; j < w.length; j++) {
    if (w[i].a < w[j].b && w[j].a < w[i].b && w[i].d0 <= w[j].d1 && w[j].d0 <= w[i].d1 && (pp[w[i].f] > 1 || pp[w[j].f] > 1)) {
      const big = pp[w[i].f] > 1 ? w[i].f : w[j].f;
      return {err:'«' + fileById(big).name + '» passa ' + pp[big] + '× por minuto e, por isso, não pode partilhar dias e horas com outros vídeos da campanha. Escolha dias ou horas diferentes para cada vídeo.'};
    }
  }
  return {items:items, manual:manual, warns:warns};
}

    + (mates.length ? '<span class="hint">Neste grupo: ' + [c.name || 'esta campanha'].concat(mates.map(x=>x.name)).map(esc).join(', ') + '. Para juntar mais campanhas, abra cada uma e escolha uma do grupo.</span>' : '')

/* liga ou desliga a campanha de um grupo de posição partilhada e limpa grupos que ficaram só com uma */
function applyShare(c, sw) {
  const x = sw ? campById(sw) : null;
  if (x && x !== c) {
    if (!x.share)x.share = 'G' + Math.random().toString(36).slice(2, 8);
    c.share = x.share;

  campaigns.forEach(function(k) {if (k.share && campaigns.filter(z=>z.share === k.share).length < 2)k.share = null;});
}

/* proporção dos vídeos vs. ecrãs */
function aspectHint() {
  const f = $('#modal-root form[data-form="campaign"]'), el = $('#asp-hint'); if (!f || !el) return;
  const vs = Array.prototype.map.call(f.querySelectorAll('input[name="venue"]:checked'), i=>i.value);
  const ids = Array.prototype.map.call(f.querySelectorAll('input[name="ci"]:checked'), i=>i.value);
  const scr = screens.filter(x=>vs.indexOf(x.venue) > -1), fs = ids.map(fileById).filter(Boolean), out = [];
  const W = t=>'<div class="pl-warn">' + ic('alert') + '<span>' + t + '</span></div>', I = t=>'<div class="pl-warn info">' + ic('check') + '<span>' + t + '</span></div>';
  if (fs.length && scr.length) {
    scr.forEach(function(x) {if (!fs.some(c=>okFor(c, x)))out.push(W('<b>' + esc(x.id) + ' · ' + esc(x.venue) + ', ' + esc(x.spot) + '</b> (' + esc(resTxt(x)) + ') não tem nenhum conteúdo compatível, por isso a campanha não vai passar neste ecrã.'));});
    fs.forEach(function(c) {
      const ok = scr.filter(x=>okFor(c, x));
      if (!ok.length) {out.push(W('<b>«' + esc(c.name) + '»</b> (' + esc(c.res) + ') não está associado a nenhum dos ecrãs desta campanha, por isso não vai passar.')); return;}
      const e1 = ok.filter(x=>fitOf(c, x).k === 'escala'), e2 = ok.filter(x=>fitOf(c, x).k === 'ajuste');
      if (e1.length)out.push(I('<b>Ajuste automático.</b> «' + esc(c.name) + '» (' + esc(c.res) + ') é redimensionado, com a mesma proporção, em: ' + e1.map(x=>esc(x.id) + ' (' + esc(x.res) + ')').join(', ') + '.'));
      if (e2.length)out.push(I('<b>Ajuste automático.</b> A proporção de «' + esc(c.name) + '» (' + esc(c.res) + ') foi corrigida (diferença de ' + Math.max.apply(null, e2.map(x=>fitOf(c, x).px)) + ' px no máximo) em: ' + e2.map(x=>esc(x.id) + ' (' + esc(x.res) + ')').join(', ') + '.'));
    });
  }
  el.innerHTML = out.join('');
}
document.addEventListener('change', function(e) {if (e.target.name === 'venue' || e.target.name === 'ci')aspectHint();});

const DISK_TOTAL = 80 * 1073741824;   // espaço do servidor (plano contratado)
const sizeBytes = function(t) {const m = /([\d.,]+)\s*(KB|MB|GB)/i.exec(t || ''); if (!m) return 0; return parseFloat(m[1].replace(',', '.')) * ({KB:1024, MB:1048576, GB:1073741824}[m[2].toUpperCase()]);};
const fmtBytes = b=>b >= 1073741824 ? (b / 1073741824).toFixed(1).replace('.', ',') + ' GB' : (b >= 1048576 ? Math.round(b / 1048576) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB');
function diskInfo() {const d = state.serverDisk; if (d && d.total > 0) {const used = Math.max(0, d.total - d.free); return {used:used, free:d.free, pct:Math.min(100, used / d.total * 100)};} const used = contents.reduce((a, f)=>a + sizeBytes(f.size), 0); return {used:used, free:Math.max(0, DISK_TOTAL - used), pct:Math.min(100, used / DISK_TOTAL * 100)};}
function diskCard() {
  const d = diskInfo(), warn = d.pct >= 80;
  return '<div class="' + (warn ? 'banner' : '') + '" style="' + (warn ? '' : '') + '">' + (warn ? ic('alert') + '<p><b>Armazenamento quase cheio:</b> ' + d.pct.toFixed(0) + ' % usado. Apague conteúdos que já não usa ou aumente o espaço do servidor.</p>' : '') + '</div>'
    + '<div class="netbar" role="img" aria-label="Armazenamento usado"><i style="width:' + d.pct.toFixed(2) + '%;background:' + (warn ? 'var(--bad)' : 'var(--accent)') + '"></i></div>'
    + '<div class="legend"><span style="--lc:' + (warn ? 'var(--bad)' : 'var(--accent)') + '">Usado <b>' + fmtBytes(d.used) + '</b></span><span style="--lc:var(--line-strong)">Livre <b>' + fmtBytes(d.free) + '</b></span><span>Total <b>' + fmtBytes(DISK_TOTAL) + '</b></span></div>';
}
const diskLow = s=>!!s.disk && s.disk.free / s.disk.total < 0.1;

 campanhas:{t:'Campanhas', intro:'Uma campanha diz o que passa, onde, quando e com que frequência.', blocks:[

const kb = t=>String(t).replace(/«([^»]+)»/g, '<span class="kbtn">$1</span>');
function helpBlocks() {
  const m = MANUAL[state.view]; if (!m) return [];
  const ok = p=>!p || can(p);
  return m.blocks.filter(b=>ok(b.need)).map(b=>({b:b, st:b.steps.filter(x=>ok(x[2]))})).filter(o=>o.st.length);
}
function helpBody() {
  const m = MANUAL[state.view], bl = helpBlocks(); if (!m || !bl.length) return '';
  const i = Math.min(state.helpTab || 0, bl.length - 1), o = bl[i];
  const chips = bl.length > 1 ? '<div class="chips help-tabs" role="tablist">' + bl.map((x, k)=>'<button class="chip" role="tab" data-a="help-tab" data-i="' + k + '" aria-pressed="' + (k === i) + '">' + x.b.h + '</button>').join('') + '</div>' : '';
  const steps = '<ol class="help-steps">' + o.st.map(x=>'<li data-a="help-step" role="checkbox" aria-checked="false" tabindex="0"><span class="hs-n"></span><span class="hs-t"><b>' + kb(x[0]) + '</b><span>' + kb(x[1]) + '</span></span></li>').join('') + '</ol>';
  const go = (o.b.go && document.querySelector('#head .head-actions .btn.primary')) ? '<div class="help-go"><button class="btn primary" data-a="help-go">Experimentar agora</button><span class="muted">Fecha o manual e abre o botão certo.</span></div>' : '';
  const tips = (m.tips || []).filter(x=>!x[1] || can(x[1])).map(x=>'<div class="pl-warn info">' + ic('check') + '<span>' + kb(x[0]) + '</span></div>').join('');
  return chips + '<p class="help-hint muted">Toque num passo quando o tiver feito, para ir marcando.</p>' + steps + go + (tips ? '<h3 class="sec-t">Dicas e avisos</h3>' + tips : '');
}
function helpModal() {
  const m = MANUAL[state.view]; if (!m) return;
  state.helpTab = 0;
  modal('<div class="modal-h"><div><h2>Como funciona · ' + m.t + '</h2><p class="muted">' + m.intro + '</p></div><button class="btn ghost sm" data-a="close" aria-label="Fechar">' + ic('x') + '</button></div>'

/* ---------- conteúdos ---------- */
const isAdm = ()=>!!(state.user && state.user.admin);
function houseCard() {
  if (!isAdm()) return '';
  const hs = contents.filter(f=>f.house && f.ready !== false), miss = screens.filter(s=>!houseFor(s).length);
  if (!hs.length) return '<div class="banner">' + ic('alert') + '<p><b>Ainda não há spot da Enif.</b> Em qualquer conteúdo, use «Usar como spot da Enif» (no máximo ' + HOUSE_MAX + ' por ecrã; cada ecrã precisa do spot na sua resolução). O spot entra 1 vez em cada volta do loop, quando o ecrã tem vaga; se o ecrã estiver cheio, passa 1 vez a cada 5 minutos.</p></div>';
  if (miss.length) return '<div class="banner">' + ic('alert') + '<p><b>Spot da Enif:</b> cobre ' + (screens.length - miss.length) + ' de ' + screens.length + ' ecrãs. Sem versão para: ' + miss.map(s=>esc(s.id) + ' (' + esc(resTxt(s)) + ')').join(', ') + '.</p></div>';
  return '<p class="hint" style="margin:0 0 10px">Spot da Enif: ' + hs.length + (hs.length === 1 ? ' conteúdo' : ' conteúdos') + ' (máximo ' + HOUSE_MAX + ' por ecrã), cobre os ' + screens.length + ' ecrãs. Com 2 num ecrã, alternam. Entra 1 vez em cada volta do loop quando há vaga; com o ecrã cheio, passa a cada 5 minutos.</p>';
}

async function finishUpload(fd, err) {

}

  const name = String(fd.get('name') || '').trim(), client = String(fd.get('client') || '').trim();
  const vs = fd.getAll('venue'), sv = fd.get('start'), ev = fd.get('end');
  const raw0 = fd.getAll('h0'), raw1 = fd.getAll('h1'), rawIv = raw0.map((v, q)=>[+v, +raw1[q]]);
  const ppm = parseFloat(String(fd.get('ppm')).replace(',', '.'));
  const dur = Math.round(parseFloat(String(fd.get('dur')).replace(',', '.')));
  const sales = String(fd.get('sales') || '').trim();
  const sSel = String(fd.get('sectorSel') || ''), sector = (sSel === '__other' ? String(fd.get('sectorOther') || '') : sSel).replace(/\s+/g, ' ').trim();
  if (!name) {err.textContent = 'Dê um nome à campanha.'; return;}
  if (sSel === '__other' && !sector) {err.textContent = 'Escreva o tipo de negócio ou escolha «Sem tipo definido».'; return;}
  if (sales && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(sales)) {err.textContent = 'O e-mail do comercial não parece válido. Exemplo: nome@empresa.pt'; return;}
  if (!vs.length) {err.textContent = 'Escolha pelo menos um local.'; return;}
  if (!sv || !ev || parseISO(ev) < parseISO(sv)) {err.textContent = 'A data de fim tem de ser igual ou posterior à de início.'; return;}
  if (!rawIv.length || rawIv.some(v=>!(v[1] > v[0]))) {err.textContent = 'Em cada intervalo, a hora de fim tem de ser depois da hora de início.'; return;}
  const mg = mergeIvs(rawIv), h0 = mg.list[0][0], h1 = mg.list[mg.list.length - 1][1], cvl = mg.list;
  if (!(dur >= 3 && dur <= 60)) {err.textContent = 'Duração do vídeo: indique entre 3 e 60 segundos.'; return;}
  if (!(ppm >= 0.2 && ppm <= 12)) {err.textContent = 'Passagens por minuto: indique um valor entre 0,2 (1 a cada 5 minutos) e 12.'; return;}
  const ri = readItems(fd, h0, h1, parseISO(sv), parseISO(ev), cvl);
  if (ri.err) {err.textContent = ri.err; return;}
  const data = {name:name, client:client || 'Sem cliente', venues:vs, start:parseISO(sv), end:parseISO(ev), h0:h0, h1:h1, ivs:cvl.length > 1 ? cvl : null, ppm:ppm, dur:dur, priority:fd.get('priority'), items:ri.items, manual:ri.manual, sales:sales, sector:sector};
  let c;
  if (f.dataset.id) {c = campById(f.dataset.id); Object.assign(c, data);}
  else {c = Object.assign({id:'C' + Date.now().toString(36), color:campaigns.length % 6 + 1}, data); campaigns.push(c);}
  applyShare(c, String(fd.get('shareWith') || ''));
  closeModal();
  const n = allIssues().reduce((a, g)=>a + (g.i.ids.indexOf(c.id) > -1 ? g.screens.length : 0), 0);
  
  audit(f.dataset.id ? 'Atualizou a campanha' : 'Criou a campanha', c.name);
  const warnIv = (mg.over ? ['Intervalos da campanha sobrepostos juntados em ' + ivTxt(cvl) + '.'] : []).concat(ri.warns);
  toast((f.dataset.id ? 'Campanha atualizada.' : 'Campanha criada.') + (warnIv.length ? ' Aviso: ' + warnIv.join(' ') : '') + (n ? ' Atenção: conflito de playlist em ' + n + (n === 1 ? ' ecrã.' : ' ecrãs.') : ''));
  if (state.view !== 'campanhas' && !f.dataset.id) {state.view = 'campanhas';}
  render();
});

try {const sv = localStorage.getItem('enif-theme'); if (sv === 'light' || sv === 'dark')applyTheme(sv);} catch (e) {/* sem ação */}
['click', 'change', 'submit'].forEach(function(ev) {document.addEventListener(ev, function() {queueSave();});});
window.addEventListener('beforeunload', function(e) {if (state.user && (saving || extraOps.length)) {e.preventDefault(); e.returnValue = '';}});
boot();
})();
</script>
