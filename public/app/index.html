<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enif OOH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Liquid Glass: translucent, blurred surfaces floating over soft colour fields, with a bright specular edge.
   Large panels blur what is behind them; small controls stay translucent without blur to keep it light.
   Layout: floating sidebar + one working column; a floating glass tab bar on phones. */
:root{
  --bg:#E8EEF8; --solid:#F6F8FC;
  --orb1:rgba(70,130,255,.50); --orb2:rgba(40,200,200,.38); --orb3:rgba(255,168,110,.38); --orb4:rgba(150,120,255,.26);
  --surface:rgba(255,255,255,.55); --surface-strong:rgba(255,255,255,.76); --surface-2:rgba(255,255,255,.42);
  --field:rgba(255,255,255,.64); --field-hover:rgba(255,255,255,.88);
  --sheen:rgba(255,255,255,.45); --hi:rgba(255,255,255,.92); --edge:rgba(255,255,255,.78);
  --shadow:0 12px 36px rgba(31,48,96,.13),0 2px 8px rgba(31,48,96,.06);
  --shadow-sm:0 1px 3px rgba(31,48,96,.14);
  --fg:#121826; --muted:#4D586B;
  --line:rgba(25,40,80,.10); --line-strong:rgba(25,40,80,.22);
  --accent:#1D5FE5; --accent-ink:#FFFFFF; --accent-soft:rgba(29,95,229,.14);
  --ok:#0F7A3A; --ok-soft:rgba(22,140,72,.15); --warn:#8F5200; --warn-soft:rgba(235,150,20,.20); --bad:#B3261E; --bad-soft:rgba(220,60,50,.15);
  --bar:rgba(50,75,130,.28);
  --c1:#1D5FE5; --c2:#0B8587; --c3:#B4501B; --c4:#66771A; --c5:#8A4F9E; --c6:#47546A;
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#080C14; --solid:#141A25;
    --orb1:rgba(45,100,255,.42); --orb2:rgba(20,170,170,.30); --orb3:rgba(255,115,70,.22); --orb4:rgba(130,90,255,.30);
    --surface:rgba(30,37,52,.55); --surface-strong:rgba(26,32,46,.80); --surface-2:rgba(255,255,255,.07);
    --field:rgba(255,255,255,.08); --field-hover:rgba(255,255,255,.15);
    --sheen:rgba(255,255,255,.08); --hi:rgba(255,255,255,.20); --edge:rgba(255,255,255,.14);
    --shadow:0 14px 40px rgba(0,0,0,.50),0 2px 8px rgba(0,0,0,.35);
    --shadow-sm:0 1px 3px rgba(0,0,0,.45);
    --fg:#EEF2F9; --muted:#A5B0C3;
    --line:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.22);
    --accent:#6E9CFF; --accent-ink:#08101F; --accent-soft:rgba(110,156,255,.20);
    --ok:#5ED28E; --ok-soft:rgba(94,210,142,.17); --warn:#F0B659; --warn-soft:rgba(240,182,89,.17); --bad:#FF8C86; --bad-soft:rgba(255,140,134,.17);
    --bar:rgba(255,255,255,.22);
    --c1:#6E9CFF; --c2:#43C6C8; --c3:#EA9160; --c4:#B0C25A; --c5:#C792DB; --c6:#9FAABF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#080C14; --solid:#141A25;
  --orb1:rgba(45,100,255,.42); --orb2:rgba(20,170,170,.30); --orb3:rgba(255,115,70,.22); --orb4:rgba(130,90,255,.30);
  --surface:rgba(30,37,52,.55); --surface-strong:rgba(26,32,46,.80); --surface-2:rgba(255,255,255,.07);
  --field:rgba(255,255,255,.08); --field-hover:rgba(255,255,255,.15);
  --sheen:rgba(255,255,255,.08); --hi:rgba(255,255,255,.20); --edge:rgba(255,255,255,.14);
  --shadow:0 14px 40px rgba(0,0,0,.50),0 2px 8px rgba(0,0,0,.35);
  --shadow-sm:0 1px 3px rgba(0,0,0,.45);
  --fg:#EEF2F9; --muted:#A5B0C3;
  --line:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.22);
  --accent:#6E9CFF; --accent-ink:#08101F; --accent-soft:rgba(110,156,255,.20);
  --ok:#5ED28E; --ok-soft:rgba(94,210,142,.17); --warn:#F0B659; --warn-soft:rgba(240,182,89,.17); --bad:#FF8C86; --bad-soft:rgba(255,140,134,.17);
  --bar:rgba(255,255,255,.22);
  --c1:#6E9CFF; --c2:#43C6C8; --c3:#EA9160; --c4:#B0C25A; --c5:#C792DB; --c6:#9FAABF;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:12px}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* colour field behind the glass */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(52% 46% at 10% 6%,var(--orb1),transparent 62%),
    radial-gradient(46% 42% at 92% 10%,var(--orb2),transparent 62%),
    radial-gradient(50% 46% at 86% 94%,var(--orb3),transparent 62%),
    radial-gradient(44% 40% at 6% 92%,var(--orb4),transparent 62%)}

/* glass surfaces */
.card,.side,.login-card{
  background:linear-gradient(180deg,var(--sheen),transparent 46%),var(--surface);
  -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  border:1px solid var(--edge);box-shadow:var(--shadow),inset 0 1px 0 var(--hi)}
.card{border-radius:24px;min-width:0}
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .card,.side,.login-card,.modal{background:var(--solid)}
}

/* shell */
.app,.login{position:relative;z-index:1}
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:12px;height:calc(100vh - 24px);height:calc(100dvh - 24px);margin:12px;align-self:start;display:flex;flex-direction:column;gap:22px;padding:20px 12px;border-radius:28px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px;font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand svg{width:22px;height:22px;fill:var(--accent);filter:drop-shadow(0 2px 6px color-mix(in srgb,var(--accent) 45%,transparent))}
.brand span{font-weight:500;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;border:1px solid transparent;border-radius:16px;background:none;color:var(--muted);font-weight:500;text-align:left;transition:background .15s,color .15s}
.nav button:hover{background:var(--field);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--accent-soft);border-color:var(--edge);box-shadow:inset 0 1px 0 var(--hi);color:var(--accent);font-weight:600}
.side-foot{margin-top:auto;padding:0 10px;font-size:12px;color:var(--muted)}
.main{padding:28px clamp(16px,3vw,36px) 56px 8px;width:100%;max-width:1240px;min-width:0}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:22px}
.page-head h1{font-size:28px;line-height:1.2;letter-spacing:-.025em;font-weight:700;text-wrap:balance}
.page-head .sub{margin-top:4px;color:var(--muted)}
.head-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border:1px solid var(--edge);border-radius:999px;background:var(--field);box-shadow:var(--shadow-sm),inset 0 1px 0 var(--hi);font-weight:600;white-space:nowrap;transition:background .15s,transform .1s}
.btn:hover{background:var(--field-hover)}
.btn:active{transform:scale(.98)}
.btn.primary{border-color:transparent;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent));color:var(--accent-ink);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 36%,transparent),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.primary:hover{filter:brightness(1.07);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent))}
.btn.ghost{border-color:transparent;background:none;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:var(--field);color:var(--fg)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn svg.i{width:18px;height:18px}
.btn[disabled]{opacity:.3;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border:1px solid var(--edge);border-radius:999px;background:var(--field);box-shadow:var(--shadow-sm),inset 0 1px 0 var(--hi);font-weight:500;color:var(--muted)}
.chip:hover{color:var(--fg);background:var(--field-hover)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip b{font-weight:600;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--edge);border-radius:999px;background:var(--field);box-shadow:inset 0 1px 2px rgba(0,0,0,.06),inset 0 1px 0 var(--hi)}
.seg button{border:0;border-radius:999px;background:none;padding:6px 14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-strong);color:var(--accent);box-shadow:var(--shadow-sm),inset 0 1px 0 var(--hi)}
input,select{width:100%;min-width:0;padding:10px 13px;border:1px solid var(--line-strong);border-radius:14px;background:var(--field);box-shadow:inset 0 1px 2px rgba(0,0,0,.05)}
input[type="checkbox"]{width:auto;accent-color:var(--accent)}
select.inline{width:auto}
.search{position:relative;flex:1 1 240px;max-width:360px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search input{padding-left:38px;border-radius:999px}

/* cards, lists */
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 0}
.card-h h2{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-b{padding:10px 20px 18px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.kpi{padding:18px 20px}
.kpi .label{color:var(--muted);font-size:13px}
.kpi .val{margin-top:2px;font-size:30px;line-height:1.25;font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:15px;font-weight:500;color:var(--muted)}
.kpi .note{margin-top:2px;font-size:12.5px;color:var(--muted)}
.kpi.alert .val{color:var(--warn)}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .title{font-weight:600}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ico{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;flex:none;box-shadow:inset 0 1px 0 var(--hi)}
.ico.bad{background:var(--bad-soft);color:var(--bad)}
.ico.warn{background:var(--warn-soft);color:var(--warn)}
.ico.ia{background:var(--accent-soft);color:var(--accent)}
.ico.ok{background:var(--ok-soft);color:var(--ok)}
.empty{padding:22px 0;text-align:center;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted);box-shadow:inset 0 1px 0 var(--hi)}
.pill.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.netbar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--surface-2);margin:8px 0 12px;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.netbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:13px}
.legend b{color:var(--fg);font-variant-numeric:tabular-nums}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--lc)}
.banner,.note{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 18px;margin-bottom:16px;border-radius:20px;border:1px solid var(--edge);box-shadow:var(--shadow-sm),inset 0 1px 0 var(--hi);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}
.banner{background:var(--warn-soft);color:var(--warn)}
.banner p{flex:1 1 260px;color:var(--fg)}
.note{align-items:flex-start;flex-wrap:nowrap;background:var(--accent-soft)}
.note p{color:var(--fg)}
.note svg{color:var(--accent);margin-top:2px}

/* screens table */
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}
.t-row{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.7fr) 112px;gap:12px;align-items:center;width:100%;padding:12px 20px;border:0;border-top:1px solid var(--line);background:none;text-align:left;transition:background .15s}
button.t-row:hover{background:var(--surface-2)}
.t-head{border-top:0;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding-top:16px}
.t-row small{display:block;color:var(--muted)}
.more{display:flex;justify-content:center;padding:14px;border-top:1px solid var(--line)}

/* calendar */
.cal-wrap{overflow-x:auto}
.cal{min-width:760px}
.crow{display:grid;grid-template-columns:250px repeat(7,minmax(0,1fr));align-items:center;width:100%;padding:0;border:0;border-top:1px solid var(--line);background:none;text-align:left;transition:background .15s}
button.crow:hover{background:var(--surface-2)}
.chead{border-top:0}
.dh{display:flex;flex-direction:column;align-items:center;padding:10px 0;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.dh b{font-size:16px;color:var(--fg);font-weight:600;letter-spacing:0}
.dh.today b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 35%,transparent)}
.clabel{display:block;padding:12px 20px;min-width:0}
.clabel strong{display:flex;align-items:center;gap:8px}
.clabel small{display:block;color:var(--muted)}
.cell{display:block;height:46px;position:relative}
.cell i{position:absolute;left:0;right:0;top:16px;height:14px;background:var(--bc);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.cell i.first{left:4px;border-radius:7px 0 0 7px}
.cell i.last{right:4px;border-radius:0 7px 7px 0}
.cell i.first.last{border-radius:7px}
.cell.ended i{opacity:.4}
.cell.todaycol{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.week-nav{display:flex;align-items:center;gap:6px}
.week-nav .lbl{min-width:132px;text-align:center;font-weight:600}

/* content library */
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:24px 16px;margin-bottom:16px;border:1.5px dashed var(--line-strong);border-radius:24px;background:var(--surface-2);text-align:center;transition:background .15s,border-color .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop svg.i{width:26px;height:26px;color:var(--accent)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:14px}
.tile{overflow:hidden}
.thumb{display:grid;place-items:center;aspect-ratio:16/9;max-width:100%;background:color-mix(in srgb,var(--tc) 16%,transparent);color:var(--tc);position:relative;overflow:hidden;box-shadow:inset 0 1px 0 var(--hi)}
.thumb svg.i{width:34px;height:34px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .tag{position:absolute;left:10px;top:10px;padding:1px 9px;border-radius:999px;background:var(--surface-strong);color:var(--fg);font-size:11px;font-weight:600;font-family:var(--mono);box-shadow:var(--shadow-sm)}
.tile-b{padding:12px 16px 16px;display:flex;flex-direction:column;gap:4px}
.tile-b strong{font-weight:600}
.tile-b select{margin-top:6px;padding:7px 10px;font-size:13px}

/* reports */
.chart{width:100%;height:auto;display:block}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--bar)}
.chart .bar.peak{fill:var(--accent)}
.chart .bar:hover,.chart .bar:focus{fill:var(--accent);outline:none}
.readout{min-height:22px;margin-top:6px;color:var(--muted);font-variant-numeric:tabular-nums}
.readout b{color:var(--fg)}
.tbl{width:100%;border-collapse:collapse;min-width:560px}
.tbl th{padding:10px 20px;text-align:left;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.tbl td{padding:11px 20px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl .num{text-align:right}
.scroll-x{overflow-x:auto}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;display:flex;padding:16px;overflow:auto;background:rgba(8,12,22,.42)}
.modal{margin:auto;width:min(640px,100%);border-radius:30px;border:1px solid var(--edge);background:linear-gradient(180deg,var(--sheen),transparent 40%),var(--surface-strong);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:0 30px 80px rgba(8,14,32,.30),inset 0 1px 0 var(--hi);animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.modal-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:19px;font-weight:700;letter-spacing:-.015em}
.modal-b{padding:22px 24px}
.modal-f{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field label,.lab{font-weight:600;font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 12px;max-height:190px;overflow:auto;padding:12px 14px;border:1px solid var(--line-strong);border-radius:16px;background:var(--field)}
.checks label{display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px}
.hint{color:var(--muted);font-size:13px}
.err{color:var(--bad);font-weight:600;min-height:20px}
.ai-box{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px;margin-bottom:14px;border-radius:18px;background:var(--accent-soft);box-shadow:inset 0 1px 0 var(--hi)}
.ai-box .hint{flex:1 1 220px;color:var(--fg)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 18px;margin:0 0 18px}
.facts dt{color:var(--muted);font-size:12.5px}
.facts dd{margin:2px 0 0;font-weight:600}
.sec-t{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 6px}
.log{display:flex;gap:12px;padding:7px 0;border-top:1px solid var(--line)}
.log:first-of-type{border-top:0}
.log time{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none;width:44px;padding-top:2px}
.log.bad span{color:var(--bad)} .log.warn span{color:var(--warn)}
.code{font-family:var(--mono);font-size:34px;font-weight:500;letter-spacing:.14em;text-align:center;padding:18px;border-radius:20px;background:var(--field);box-shadow:inset 0 1px 2px rgba(0,0,0,.06);margin:14px 0}

/* ---------- dados (vêm do servidor) ---------- */

function bestShift(c,maxShift){
  const len=c.h1-c.h0,cur=sumH(c.h0,c.h1);
  let best={h0:c.h0,sum:cur,gain:0};
  for(let sft=-maxShift;sft<=maxShift;sft++){
    const h0=c.h0+sft,h1=h0+len;
    if(sft===0||h0<0||h1>24)continue;
    const v=sumH(h0,h1);
    if(v>best.sum)best={h0:h0,sum:v,gain:v/cur-1};
  }
  best.h1=best.h0+len;
  return best;
}

const itemWin=(c,i)=>[Math.max(c.h0,i.h0==null?c.h0:i.h0),Math.min(c.h1,i.h1==null?c.h1:i.h1)];
/* dias efetivos de um vídeo (vazio = acompanha a campanha) */
const itemDays=(c,i)=>[(i.d0&&i.d0>c.start)?i.d0:c.start,(i.d1&&i.d1<c.end)?i.d1:c.end];
/* vídeos ativos numa hora e dia, por ordem de entrada (dia, hora) e depois pela ordem da lista */
function itemsOn(c,h,d){
  return c.items.map(function(i,k){return {i:i,k:k,w:itemWin(c,i),y:itemDays(c,i)}})
    .filter(function(x){return h>=x.w[0]&&h<x.w[1]&&(!d||(d>=x.y[0]&&d<=x.y[1]))})
    .sort(function(p,q){return c.manual?(p.k-q.k):((p.y[0]-q.y[0])||(p.w[0]-q.w[0])||(p.k-q.k))}).map(x=>x.i);
}
/* os vídeos de uma campanha alternam a cada passagem: A, B, C… e volta ao A; m = n.º da passagem */
function itemOn(c,h,d,m){
  const a=itemsOn(c,h,d);if(!a.length)return null;
  return m==null?a[0]:a[((m%a.length)+a.length)%a.length];
}
function winsOf(c,fid){
  const its=c.items.filter(i=>!fid||i.f===fid);
  if(!c.items.length)return fid?[]:[{a:c.h0,b:c.h1,f:null,d0:c.start,d1:c.end}];
  return its.map(function(i){const w=itemWin(c,i),k=itemDays(c,i);return {a:w[0],b:w[1],f:i.f,d0:k[0],d1:k[1]}}).filter(w=>w.b>w.a&&w.d1>=w.d0).sort((x,y)=>x.a-y.a);
}
/* troços do dia: em cada troço os mesmos vídeos estão ativos e dividem as passagens da campanha por igual */
function segsOf(c,fid,d){
  if(!c.items.length)return [{a:c.h0,b:c.h1,f:null,share:1}];
  const act=c.items.map(function(i){return {i:i,w:itemWin(c,i),y:itemDays(c,i)}}).filter(x=>x.w[1]>x.w[0]&&d>=x.y[0]&&d<=x.y[1]);
  const pts=[];act.forEach(function(x){x.w.forEach(function(v){if(pts.indexOf(v)<0)pts.push(v)})});pts.sort((a,b)=>a-b);
  const out=[];
  for(let k=0;k+1<pts.length;k++){

    on.forEach(function(x){const n=x.i.ppm||1;if(!fid||x.i.f===fid)out.push({a:a,b:b,f:x.i.f,share:1/on.length,mult:n>1?Math.max(c.ppm,n)/c.ppm:1})});

function cfgOf(s,draft){if(!s.order)s.order=[];return draft&&s.draft?s.draft:s}
function playlistOf(s,draft){
  const cf=cfgOf(s,draft);
  const valid=campaigns.filter(c=>statusOf(c)!=='Terminada'&&c.venues.indexOf(s.venue)>-1);
  const ids=valid.map(c=>c.id),ord=cf.order.filter(id=>ids.indexOf(id)>-1);
  valid.slice().sort((a,b)=>PRI[b.priority]-PRI[a.priority]||a.start-b.start).forEach(function(c){if(ord.indexOf(c.id)<0)ord.push(c.id)});

/* o que está em loop a uma dada hora: as campanhas em horário, pela ordem da playlist, até ao limite */
/* vezes que a campanha entra numa volta do loop: o maior «passagens por minuto» dos vídeos ativos */
function copiesOf(c,d,h){
  let k=Math.max(1,Math.ceil(c.ppm-1e-9));
  if(c.items.length)itemsOn(c,h,d).forEach(function(i){if((i.ppm||1)>k)k=i.ppm});
  return Math.min(12,k);

/* repete cada campanha as vezes pedidas, distribuídas por igual ao longo da volta, pela ordem da playlist */
function spreadSeq(loop,cp){
  const m=loop.length,ev=[];
  loop.forEach(function(c,i){const k=cp[c.id]||1;for(let j=0;j<k;j++)ev.push({c:c,pos:(i+j*m/k)%m,i:i,j:j})});
  ev.sort((a,b)=>(a.pos-b.pos)||(a.i-b.i)||(a.j-b.j));
  return ev.map(e=>e.c);
}
function loopFrom(list,limit,d,h){
  const all=list.filter(c=>onAt(c,d,h)),loop=all.slice(0,limit),out=all.slice(limit);
  const cp={};loop.forEach(function(c){cp[c.id]=copiesOf(c,d,h)});
  const seq=spreadSeq(loop,cp);
  return {all:all,loop:loop,out:out,seq:seq,copies:cp,cycle:seq.reduce((a,c)=>a+c.dur,0)};
}
function loopS(s,list,limit,d,h){return screenOn(s,h)?loopFrom(list,limit,d,h):{all:[],loop:[],out:[],seq:[],copies:{},cycle:0}}
const rateOf=(c,L)=>L.cycle?((L.copies[c.id]||1)*60/L.cycle):0;
const needOf=(c,L)=>Math.max(c.ppm,L.copies[c.id]>Math.ceil(c.ppm-1e-9)?L.copies[c.id]:0);
function rateTxt(L){
  const r=L.loop.map(c=>Math.round(rateOf(c,L)*100)/100);
  if(!r.length)return '0×';
  const a=Math.min.apply(null,r),b=Math.max.apply(null,r);
  return a===b?fmtPpm(a)+'×':fmtPpm(a)+'× a '+fmtPpm(b)+'×';
}
function playingOn(s){
  if(s.status==='offline'||s.status==='novo'||!isOnNow(s))return [];
  return loopFrom(playlistOf(s,false),s.limit,today,Math.floor(hourNow)).loop;
}
function playsFor(s,c,d,from,to){
  if(to<=from)return 0;
  const base=playlistOf(s,false);
  const list=d<today?base.concat(campaigns.filter(x=>statusOf(x)==='Terminada'&&x.venues.indexOf(s.venue)>-1&&base.indexOf(x)<0).sort((a,b)=>PRI[b.priority]-PRI[a.priority]||a.start-b.start)):base;
  let t=0;
  for(let h=Math.floor(from);h<Math.ceil(to);h++){
    const L=loopS(s,list,s.limit,d,h);
    if(L.loop.indexOf(c)<0)continue;
    t+=(Math.min(to,h+1)-Math.max(from,h))*3600/L.cycle*(L.copies[c.id]||1);
  }
  return Math.floor(t);
}
function screenIssues(s,draft){
  if(s.status==='novo')return [];
  const cf=cfgOf(s,draft),list=playlistOf(s,draft),lim=cf.limit;
  if(!list.length)return [];
  const ds=[today];
  list.forEach(function(c){if(c.start>today&&dayDiff(c.start,today)<=90&&!ds.some(x=>dayDiff(x,c.start)===0))ds.push(c.start)});
  const rows=[];
  for(let h=0;h<24;h++){
    let best=null;
    ds.forEach(function(d){const L=loopS(s,list,lim,d,h);if(!best||L.all.length>best.L.all.length)best={L:L,d:d}});
    const L=best.L;let kind=null,ids=[];
    if(L.all.length>lim){kind='limit';ids=L.all.map(c=>c.id)}
    else if(L.loop.some(c=>needOf(c,L)>rateOf(c,L)+1e-9)){kind='ppm';ids=L.loop.map(c=>c.id)}
    else if(lim>1&&L.all.length===lim){kind='full';ids=L.all.map(c=>c.id)}
    rows.push(kind?{h:h,kind:kind,ids:ids,L:L}:null);
  }
  const out=[];
  rows.forEach(function(r){
    if(!r)return;
    const last=out[out.length-1],key=r.ids.join();
    if(last&&last.kind===r.kind&&last.h1===r.h&&last.key===key){last.h1=r.h+1;return}
    out.push({kind:r.kind,h0:r.h,h1:r.h+1,key:key,ids:r.ids,L:r.L,limit:lim,sev:r.kind==='full'?'info':'warn'});
  });
  return out;
}
function issueText(i){

  if(i.kind==='ppm'){
    const slow=i.L.loop.filter(c=>needOf(c,i.L)>rateOf(c,i.L)+1e-9);
    return when+' o loop dura '+i.L.cycle+' s, por isso '+slow.map(function(c){const r=Math.round(rateOf(c,i.L)*100)/100;return '«'+c.name+'» passa '+fmtPpm(r)+(r===1?' vez':' vezes')+' por minuto (pedido: '+fmtPpm(needOf(c,i.L))+')'}).join('; ')+'.';
  }

}
function limitFix(i){
  if(i.kind!=='limit')return 0;
  const n=i.L.all.length,sum=i.L.all.reduce((a,c)=>a+c.dur,0);

/* sugestões do painel: o que pede atenção primeiro (datas), depois oportunidades */
const SOON=2;   // dias de antecedência dos avisos de fim e de início
const FINAL_MS=24*3600*1000;   // o aviso do relatório final desaparece 24 h depois de aparecer
const whenTxt=function(d){const n=dayDiff(d,today);return n<=0?'hoje':(n===1?'amanhã':'em '+n+' dias ('+dShort.format(d)+')')};
function suggestions(){
  const list=[],G=allIssues(),dis=state.dismissed,now=Date.now();
  const push=function(o){if(!dis[o.id])list.push(o)};
  campaigns.forEach(function(c){
    const st=statusOf(c),n=dayDiff(c.start,today);
    if(st!=='Terminada'&&n>=0&&n<=SOON){
      let why=null;
      if(!c.items.length)why='ainda não tem conteúdos. Peça-os a '+c.client+'.';
      else{
        const first=c.items.map(i=>itemDays(c,i)[0]).reduce((a,b)=>a<b?a:b);
        if(dayDiff(first,c.start)>0)why='o primeiro vídeo só entra a '+dShort.format(first)+'. Até lá a campanha não tem o que passar.';
      }
      if(why)push({id:'start-'+c.id+'-'+iso(c.start),kind:'start',ord:0,c:c,n:n,why:why});
    }
    if(st==='Ativa'){
      const e=dayDiff(c.end,today);
      if(e>=0&&e<=SOON)push({id:'end-'+c.id+'-'+iso(c.end),kind:'end',ord:1,c:c,n:e});
      c.items.forEach(function(it){
        if(!it.d1||!(it.d1<c.end))return;
        const v=dayDiff(it.d1,today);
        if(v<0||v>SOON)return;
        const left=c.items.filter(x=>x!==it&&itemDays(c,x)[1]>it.d1).length;
        push({id:'vend-'+c.id+'-'+it.f+'-'+iso(it.d1),kind:'vend',ord:1,c:c,f:fileById(it.f),d1:it.d1,left:left});
      });
    }
    if(st==='Terminada'&&dayDiff(today,c.end)<=SOON&&!state.finalDone[c.id]){
      const seen=state.finalSeen[c.id]||(state.finalSeen[c.id]=now);
      if(now-seen<=FINAL_MS)push({id:'final-'+c.id,kind:'final',ord:2,c:c,ago:dayDiff(today,c.end)});
    }
  });
  if(state.fewMin>0){
    const g={};
    screens.forEach(function(s){
      if(s.status==='novo')return;
      const n=playlistOf(s,false).filter(c=>statusOf(c)==='Ativa').length;
      if(n>=state.fewMin)return;
      const k=s.venue+'|'+n;(g[k]=g[k]||{venue:s.venue,n:n,screens:[]}).screens.push(s);
    });
    Object.keys(g).forEach(function(k){push({id:'few-'+k+'-'+state.fewMin,kind:'few',ord:3,venue:g[k].venue,n:g[k].n,screens:g[k].screens})});
  }
  campaigns.filter(c=>statusOf(c)!=='Terminada'&&!G.some(x=>x.i.ids.indexOf(c.id)>-1))
    .map(c=>({c:c,b:bestShift(c,2)})).filter(o=>o.b.gain>=0.05).sort((p,q)=>q.b.gain-p.b.gain)
    .forEach(function(o){push({id:'op-'+o.c.id+'-'+o.c.h0,kind:'optimize',ord:4,c:o.c,b:o.b})});
  return list.map((o,k)=>({o:o,k:k})).sort((a,b)=>a.o.ord-b.o.ord||a.k-b.k).map(x=>x.o);
}

function readPhoto(file,done,fail){
  if(!file||!/^image\//.test(file.type||'')){fail('Escolha um ficheiro de imagem (JPG ou PNG).');return}
  if(file.size>15*1024*1024){fail('A imagem é demasiado grande. Escolha uma com menos de 15 MB.');return}
  const fr=new FileReader();
  fr.onerror=function(){fail('Não foi possível ler a imagem.')};
  fr.onload=function(){
    const im=new Image();
    im.onerror=function(){fail('Não foi possível abrir a imagem. Tente um JPG ou PNG.')};
    im.onload=function(){
      try{
        const n=256,cv=document.createElement('canvas');cv.width=n;cv.height=n;
        const side=Math.min(im.width,im.height),sx=(im.width-side)/2,sy=(im.height-side)/2;
        const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,n,n);x.drawImage(im,sx,sy,side,side,0,0,n,n);
        done(cv.toDataURL('image/jpeg',0.85));
      }catch(e){fail('Não foi possível processar a imagem.')}
    };
    im.src=fr.result;
  };
  fr.readAsDataURL(file);
}

  return kpis+'<div class="cols"><div class="stack">'

function plState(c,s,L,h){
  if(statusOf(c)==='Agendada')return ['sched','Agendada · '+dShort.format(c.start),'accent'];
  if(!screenOn(s,h))return ['off','Ecrã desligado',''];
  if(!onAt(c,today,h))return ['off',h<c.h0?'Entra às '+c.h0+'h':(h>=c.h1?'Saiu às '+c.h1+'h':'Sem vídeo a esta hora'),''];
  if(L.out.indexOf(c)>-1)return ['limit','Fora do limite agora','warn'];
  if(s.status==='offline')return ['off','Em espera · sem sinal',''];
  return ['on','A passar agora','ok dot'];
}
function ensureDraft(s){if(!s.draft)s.draft={order:playlistOf(s,false).map(c=>c.id),limit:s.limit};return s.draft}
function trimDraft(s){
  const d=s.draft;if(!d)return;
  playlistOf(s,true);playlistOf(s,false);
  if(d.limit===s.limit&&d.order.join()===s.order.join())s.draft=null;
}
function playlistHtml(s){

  const slot={};let acc=0;
  L.seq.forEach(function(c){const t=acc+'–'+(acc+c.dur)+' s';slot[c.id]=slot[c.id]?slot[c.id]+' · '+t:t;acc+=c.dur});
  const stepper=edit?'<span class="stepper" role="group" aria-label="Máximo de campanhas em simultâneo"><button class="btn sm" data-a="limit" data-id="'+s.id+'" data-d="-1" aria-label="Menos uma campanha">−</button><input class="lim-in" type="number" min="1" max="'+LIM_MAX+'" step="1" value="'+lim+'" data-a-change="limit-input" data-id="'+s.id+'" aria-label="Número máximo de campanhas em simultâneo"><button class="btn sm" data-a="limit" data-id="'+s.id+'" data-d="1" aria-label="Mais uma campanha">+</button></span>':'<b>'+lim+'</b>';
  const draftBar=s.draft?'<div class="pl-draft">'+ic('alert')+'<p>Alterações por enviar. O ecrã continua a mostrar a versão anterior.</p><button class="btn sm" data-a="preview" data-id="'+s.id+'">'+ic('eye')+'Pré-visualizar</button>'+(edit?'<button class="btn sm primary" data-a="pl-send" data-id="'+s.id+'">'+ic('upload')+'Enviar para o ecrã</button><button class="btn sm ghost" data-a="pl-discard" data-id="'+s.id+'">Descartar</button>':'')+'</div>':'';
  const strip='<div class="pl-strip"><span>'+(!screenOn(s,h)?'Ecrã desligado agora ('+schedTxt(s)+'). Ele '+untilTxt(s)+'.':(L.loop.length?'Às '+h+'h: <b>'+L.loop.length+(L.loop.length===1?' campanha':' campanhas')+'</b> em loop · <b>'+L.cycle+' s</b> por volta · passam <b>'+rateTxt(L)+'</b> por minuto':'Sem campanhas em loop às '+h+'h.'))+'</span>'+(s.draft?'':'<button class="btn sm" data-a="preview" data-id="'+s.id+'" style="margin-left:auto">'+ic('eye')+'Pré-visualizar o ecrã</button>')+'</div>';
  const warns=screenIssues(s,true).map(function(i){

    return '<div class="pl-warn'+(i.sev==='info'?' info':'')+'">'+ic(i.sev==='info'?'check':'alert')+'<span>'+(i.sev==='info'?'':'<b>Conflito. </b>')+issueText(i)+'</span>'+(fix?'<button class="btn sm" data-a="limit-set" data-id="'+s.id+'" data-n="'+fix+'">Subir limite para '+fix+'</button>':'')+'</div>';
  }).join('');
  let items='';
  list.forEach(function(c,i){
    const st=plState(c,s,L,h);
    const nv=c.items.length;
    items+='<div class="pl-item '+st[0]+'"><span class="pl-n">'+(i+1)+'</span><span class="grow"><b class="ell" style="display:block">'+esc(c.name)+'</b><small class="muted">'+esc(c.client)+' · '+hrs(c.h0,c.h1)+' · '+c.dur+' s'+(nv>1?' · '+nv+' vídeos':'')+(slot[c.id]?' · <span class="pl-slot">no loop '+slot[c.id]+'</span>':'')+'</small></span><span class="pill '+st[2]+'">'+st[1]+'</span>'
      +(edit?'<span class="pl-btns"><button class="btn sm ghost" data-a="pl-move" data-id="'+s.id+'" data-i="'+i+'" data-d="-1" aria-label="Subir na playlist"'+(i===0?' disabled':'')+'>'+ic('up')+'</button><button class="btn sm ghost" data-a="pl-move" data-id="'+s.id+'" data-i="'+i+'" data-d="1" aria-label="Descer na playlist"'+(i===list.length-1?' disabled':'')+'>'+ic('down')+'</button></span>':'')+'</div>';
  });
  const sameVenue=screens.filter(x=>x.venue===s.venue).length>1;
  return draftBar+'<div class="pl-head"><div><b>'+list.length+(list.length===1?' campanha':' campanhas')+'</b> <span class="muted">na playlist</span></div><div class="pl-limit"><span class="muted">Máximo em simultâneo</span>'+stepper+'</div></div>'
    +strip+warns
    +(items||'<p class="muted">Nenhuma campanha associada a este local.</p>')
    +'<p class="hint" style="margin-top:8px">A playlist corre sempre em loop, pela ordem acima, sem interrupções. Se o minuto não estiver completo, recomeça logo do início. O horário de cada campanha só diz quando ela entra e sai do loop.</p>'
    +(edit&&sameVenue?'<div style="margin-top:8px"><button class="btn sm" data-a="pl-copy-venue" data-id="'+s.id+'">Copiar esta playlist para os outros ecrãs de '+esc(s.venue)+'</button></div>':'');
}

    +(rows||'<div class="empty">'+(screens.length?'Nenhum ecrã corresponde à pesquisa.':'Ainda não há ecrãs.'+(can('ecras.gerir')?' Crie o primeiro em «Novo ecrã».':''))+'</div>')
    +(list.length>shown.length?'<div class="more"><button class="btn" data-a="more">Mostrar mais ('+(list.length-shown.length)+')</button></div>':'');

function logsFor(s){
  const t=ms=>{const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes())};
  if(s.status==='novo'||!s.lastSeen)return [['—','Ecrã registado. À espera da primeira ligação do player.','warn']];
  const out=[];
  if(s.status==='offline')out.push([t(s.lastSeen),'Sem sinal há '+(s.sinceMin||'?')+' min. O player deixou de responder.','bad']);
  else if(s.status==='atencao')out.push([t(s.lastSeen),s.issueLog||'Falhas de reprodução.','warn']);
  else out.push([t(s.lastSeen),'Último sinal recebido. Reprodução normal.','']);
  if(s.nowCamp){const c=campById(s.nowCamp);out.push([t(s.lastSeen),'A passar «'+(c?c.name:s.nowCamp)+'».',''])}
  if(s.queue>=10)out.push([t(s.lastSeen),s.queue+' passagens ainda por enviar (o ecrã esteve sem ligação).','warn']);
  if(s.ver)out.push([t(s.lastSeen),'Versão do player: '+s.ver+'.','']);
  return out;
}

/* ---------- pré-visualização do ecrã ---------- */
let pv=null,pvTimer=null;
function pvStop(){if(pvTimer){clearInterval(pvTimer);pvTimer=null}}
function pvAspect(s){const m=/(\d+)\s*[×x]\s*(\d+)/.exec(s.res||'');return m&&+m[1]>0&&+m[2]>0?[+m[1],+m[2]]:[16,9]}
function pvCalc(){
  const s=screens.find(x=>x.id===pv.id),dr=pv.ver==='draft'&&!!s.draft;
  const h=pv.h==null?Math.floor(hourNow):pv.h;
  return {s:s,dr:dr,h:h,L:loopS(s,playlistOf(s,dr),cfgOf(s,dr).limit,today,h)};
}
function pvPos(L,t){
  if(!L.cycle)return null;
  const p=((t%L.cycle)+L.cycle)%L.cycle;let acc=0;
  for(let i=0;i<L.seq.length;i++){const d=L.seq[i].dur;if(p<acc+d)return {i:i,at:p-acc,left:acc+d-p};acc+=d}
  return {i:0,at:0,left:L.seq[0].dur};
}
function previewModal(id,ver){
  const s=screens.find(x=>x.id===id);if(!s)return;
  pv={id:id,ver:ver||(s.draft?'draft':'live'),h:null,t:0,speed:1,playing:true,last:''};
  pvDraw();
}
function pvDraw(){
  const C=pvCalc(),s=C.s,L=C.L,edit=can('playlist.gerir'),ar=pvAspect(s);
  const hourOpts2='<option value=""'+(pv.h==null?' selected':'')+'>Agora ('+pad(Math.floor(hourNow))+'h)</option>'+Array.from({length:24},(_,h)=>'<option value="'+h+'"'+(pv.h===h?' selected':'')+'>Hoje às '+pad(h)+'h</option>').join('');
  const ver=s.draft?'<div class="seg sm" role="group" aria-label="Versão a pré-visualizar"><button data-a="pv-ver" data-v="live" aria-pressed="'+(!C.dr)+'">Em exibição</button><button data-a="pv-ver" data-v="draft" aria-pressed="'+C.dr+'">Por enviar</button></div>':'';
  const line=L.seq.map(function(c){return '<span style="flex:'+c.dur+' 1 0;--bc:var(--c'+c.color+')" title="'+esc(c.name)+'"><b class="ell">'+(L.loop.indexOf(c)+1)+'</b></span>'}).join('');
  const out=L.out.length?'<p class="hint" style="margin-top:6px">Fora do limite a esta hora: '+names(L.out.map(c=>c.id))+'.</p>':'';
  const warn=screenIssues(s,C.dr).filter(i=>i.sev==='warn'&&C.h>=i.h0&&C.h<i.h1).map(i=>'<div class="pl-warn">'+ic('alert')+'<span><b>Conflito. </b>'+issueText(i)+'</span></div>').join('');
  modal('<div class="modal-h"><div><h2>Pré-visualização</h2><p class="muted">'+esc(s.venue)+' · '+esc(s.spot)+' · <span class="mono">'+s.id+'</span></p></div><button class="btn ghost sm" data-a="close" aria-label="Fechar">'+ic('x')+'</button></div>'
    +'<div class="modal-b"><div class="pv-ctl">'+ver+'<select id="pv-hour" data-a-change="pv-hour" aria-label="Hora a pré-visualizar" style="width:auto;border-radius:999px">'+hourOpts2+'</select></div>'
    +'<div class="pv-wrap"><div class="pv-stage" id="pv-stage" style="aspect-ratio:'+ar[0]+'/'+ar[1]+';width:min(100%,'+(46*ar[0]/ar[1]).toFixed(1)+'vh)"></div></div>'
    +'<div class="pv-ctl"><button class="btn sm" data-a="pv-prev" aria-label="Campanha anterior">'+ic('left')+'</button><button class="btn sm" id="pv-play" data-a="pv-toggle">'+ic('pause')+'Pausa</button><button class="btn sm" data-a="pv-next" aria-label="Campanha seguinte">'+ic('right')+'</button><button class="btn sm ghost" id="pv-speed" data-a="pv-speed">Velocidade 1×</button></div>'
    +(L.loop.length?'<div class="pv-line" id="pv-line">'+line+'</div><p class="hint">Uma volta do loop: <b>'+L.cycle+' s</b> · passam <b>'+rateTxt(L)+'</b> por minuto.</p>':'')
    +out+warn
    +'<p class="hint" style="margin-top:10px">Simulação da ordem e do tempo de cada campanha, na resolução do ecrã ('+resTxt(s)+'). Mostra o que o ecrã vai passar com a playlist '+(C.dr?'por enviar':'atual')+', não os vídeos reais.</p></div>'
    +'<div class="modal-f"><button class="btn" data-a="open-screen" data-id="'+s.id+'">Voltar ao ecrã</button>'+(C.dr&&edit?'<button class="btn primary" data-a="pl-send" data-id="'+s.id+'">'+ic('upload')+'Enviar para o ecrã</button>':'<button class="btn primary" data-a="close">Fechar</button>')+'</div>');
  pv.last='';
  pvPaint(true);
  pvStop();
  pvTimer=setInterval(function(){
    if(!pv||!$('#pv-stage')){pvStop();return}
    if(!pv.playing)return;
    pv.t+=pv.speed;pvPaint(false);
  },1000);
}
function pvPaint(force){
  const st=$('#pv-stage');if(!st||!pv)return;
  const C=pvCalc(),L=C.L,P=pvPos(L,pv.t);
  if(!P){
    if(pv.last!=='none'){st.innerHTML='<div class="pv-face" style="background:#0b0f1a"><div class="nm">'+(screenOn(C.s,C.h)?'Sem campanhas a esta hora':'Ecrã desligado a esta hora')+'</div><div class="cl">'+(screenOn(C.s,C.h)?'O ecrã mostra o fundo de espera.':esc(schedTxt(C.s)))+'</div></div>';pv.last='none'}
    return;
  }
  const c=L.seq[P.i];
  const occ=L.seq.slice(0,P.i+1).filter(x=>x===c).length-1,mnt=Math.floor((C.h*3600+pv.t)/L.cycle)*(L.copies[c.id]||1)+occ,idx=P.i+':'+Math.floor(pv.t/L.cycle)+':'+mnt;
  if(force||pv.last!==idx){
    const it=itemOn(c,C.h,C.dr,mnt),f=it?fileById(it.f):null;

function pvJump(dir){
  const C=pvCalc(),L=C.L,P=pvPos(L,pv.t);if(!P)return;
  if(dir>0)pv.t=pv.t-P.at+L.seq[P.i].dur;

function fmtPpm(x){return String(Math.round(x*100)/100).replace('.',',')}
function ppmHint(x,dur){
  if(!(x>0))return '';
  const perHour=Math.round(x*60*100)/100,sec=60/x;
  const every=sec>=120?'1 a cada '+fmtPpm(Math.round(sec/60*10)/10)+' min':'1 a cada '+fmtPpm(Math.round(sec))+' s';
  return '= '+fmtPpm(perHour)+' passagens por hora ('+every+')'+(dur>0?'. Num minuto cabem '+Math.floor(60/dur)+' vídeos de '+dur+' s.':'');
}

}
function readItems(fd,ch0,ch1,cs,ce){
  const items=[];
  fd.getAll('ci').forEach(function(id){
    const a=fd.get('ci0_'+id),b=fd.get('ci1_'+id),x=String(fd.get('cid0_'+id)||''),y=String(fd.get('cid1_'+id)||'');
    const pr=String(fd.get('cip_'+id)==null?'1':fd.get('cip_'+id)).trim(),pn=Math.round(+pr);
    items.push({f:id,ppm:pn,h0:(a===''||a==null)?null:+a,h1:(b===''||b==null)?null:+b,d0:x?parseISO(x):null,d1:y?parseISO(y):null,_pr:pr});
  });
  for(let k=0;k<items.length;k++){
    const it=items[k];
    if(!it._pr||!(it.ppm>=1&&it.ppm<=12))return {err:'Passagens por minuto de «'+fileById(it.f).name+'»: indique um número inteiro entre 1 e 12.'};
    delete it._pr;
  }
  const manual=fd.get('order')==='manual';
  if(manual&&items.length>1){
    const pos={};
    for(let k=0;k<items.length;k++){
      const f=fileById(items[k].f),v=String(fd.get('cio_'+items[k].f)||'').trim(),n=Math.round(+v);
      if(!v||!(n>=1&&n<=99))return {err:'Indique a posição de «'+f.name+'» na ordem (1, 2, 3…).'};
      if(pos[n])return {err:'«'+fileById(pos[n]).name+'» e «'+f.name+'» têm a mesma posição ('+n+'). Cada vídeo precisa de uma posição diferente.'};
      pos[n]=items[k].f;items[k].pos=n;
    }
    items.sort((p,q)=>p.pos-q.pos);items.forEach(function(i){delete i.pos});
  }
  for(let k=0;k<items.length;k++){
    const it=items[k],f=fileById(it.f),w0=it.h0==null?ch0:it.h0,w1=it.h1==null?ch1:it.h1;
    if(w0<ch0||w1>ch1)return {err:'O horário de «'+f.name+'» tem de ficar dentro do horário da campanha ('+ch0+'h–'+ch1+'h).'};
    if(w1<=w0)return {err:'O vídeo «'+f.name+'» tem de acabar depois de começar.'};
    if((it.d0&&it.d0<cs)||(it.d1&&it.d1>ce)||(it.d0&&it.d0>ce)||(it.d1&&it.d1<cs))return {err:'Os dias de «'+f.name+'» têm de ficar dentro das datas da campanha ('+dShort.format(cs)+' a '+dShort.format(ce)+').'};
    if(it.d0&&it.d1&&it.d1<it.d0)return {err:'O vídeo «'+f.name+'» tem de sair no mesmo dia ou depois de entrar.'};
  }
  const tmp={h0:ch0,h1:ch1,start:cs,end:ce,items:items},w=winsOf(tmp,null).filter(x=>x.f),pp={};
  items.forEach(function(i){pp[i.f]=i.ppm});
  for(let i=0;i<w.length;i++)for(let j=i+1;j<w.length;j++){
    if(w[i].a<w[j].b&&w[j].a<w[i].b&&w[i].d0<=w[j].d1&&w[j].d0<=w[i].d1&&(pp[w[i].f]>1||pp[w[j].f]>1)){
      const big=pp[w[i].f]>1?w[i].f:w[j].f;
      return {err:'«'+fileById(big).name+'» passa '+pp[big]+'× por minuto e, por isso, não pode partilhar dias e horas com outros vídeos da campanha. Escolha dias ou horas diferentes para cada vídeo.'};
    }
  }
  return {items:items,manual:manual};
}

function probe(f){
  return new Promise(function(done){
    const t=f.type||'';let u=null,end=false;
    const fin=function(r){if(end)return;end=true;if(u)URL.revokeObjectURL(u);done(r||{})};
    try{
      if(t.indexOf('video')===0){
        const v=document.createElement('video');v.preload='metadata';v.muted=true;u=URL.createObjectURL(f);
        v.onloadedmetadata=function(){fin({secs:isFinite(v.duration)?Math.round(v.duration*10)/10:0,res:v.videoWidth?v.videoWidth+'×'+v.videoHeight:''})};
        v.onerror=function(){fin({})};setTimeout(function(){fin({})},8000);v.src=u;
      }else if(t.indexOf('image')===0){
        const im=new Image();u=URL.createObjectURL(f);
        im.onload=function(){fin({res:im.naturalWidth+'×'+im.naturalHeight})};im.onerror=function(){fin({})};im.src=u;
      }else fin({});
    }catch(e){fin({})}
  });
}

const REF_PASS=10000; // pessoas/dia que passam junto a um ecrã "médio" (fator 1)
function hav(a,b,c,d){const t=x=>x*Math.PI/180,dl=t(c-a),dn=t(d-b),q=Math.pow(Math.sin(dl/2),2)+Math.cos(t(a))*Math.cos(t(c))*Math.pow(Math.sin(dn/2),2);return 12742*Math.asin(Math.sqrt(q))}
function parseCoords(t){
  t=String(t||'').trim();if(!t)return null;
  try{t=decodeURIComponent(t)}catch(e){}
  const m=/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/.exec(t)||/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/.exec(t)||/[?&](?:q|ll|query)=(-?\d{1,2}\.\d+)[, ]+(-?\d{1,3}\.\d+)/.exec(t)||/^(-?\d{1,2}\.\d+)\s*[,;]\s*(-?\d{1,3}\.\d+)$/.exec(t);
  if(!m)return null;
  const la=+m[1],ln=+m[2];
  return (Math.abs(la)<=90&&Math.abs(ln)<=180)?[la,ln]:null;
}
function locInfo(s){
  const L=s.loc||{},env=ENV.find(e=>e.length&&e[0]===L.env),why=[];
  const hasC=L.lat!=null&&L.lng!=null;
  let cityF=0.9,central=1;
  const byName=CITIES.find(c=>c[0].toLowerCase()===String(s.city||'').toLowerCase());
  if(hasC){
    let best=null;
    CITIES.forEach(function(c){const d=hav(L.lat,L.lng,c[1],c[2]);if(!best||d<best.d)best={c:c,d:d}});
    if(best&&best.d<30){cityF=best.c[3];central=0.9+0.35*Math.exp(-best.d/4);why.push('a '+(Math.round(best.d*10)/10).toString().replace('.',',')+' km do centro de '+best.c[0])}
    else{cityF=0.9;why.push('longe dos grandes centros urbanos')}
  }else if(byName)cityF=byName[3];
  if(env)why.unshift(env[1]);
  let f,conf;
  if(L.pop){f=Math.max(0.15,Math.min(5,L.pop/REF_PASS));conf='alta';why.push('contagem de '+fmt.format(L.pop)+' pessoas por dia')}
  else if(env){f=env[2]*cityF*central;conf=hasC?'média':'baixa'}
  else{const n=parseInt(s.id.slice(4),10)||1;f=(0.75+((n*37)%11)/20)*cityF;conf='baixa'}
  return {f:f,conf:conf,why:why,hasC:hasC};
}

/* impressões de cada linha: a audiência do ecrã nessa hora reparte-se pelo tempo que cada vídeo esteve no ar */
function weighRows(rows){
  const sec={},sc={},fc={};
  screens.forEach(function(s){sc[s.id]=s});
  rows.forEach(function(r){const k=r.s+'|'+r.d+'|'+r.h;sec[k]=(sec[k]||0)+(r.sec||0)});
  return rows.map(function(r){
    const s=sc[r.s],T=sec[r.s+'|'+r.d+'|'+r.h]||0;
    if(!s||!r.n||!T)return {r:r,impr:0};
    const f=fc[r.s]!=null?fc[r.s]:(fc[r.s]=locInfo(s).f);
    const cover=Math.min(1,T/3600);
    return {r:r,impr:curve[r.h]*K/REF_SCREENS*f*cover*((r.sec||0)/T)};
  });
}
function getRows(slot,from,to){

function repData(){

  if(!can('relatorios.ver'))return {err:'Não tem permissão para ver relatórios.'};

  if(!rows){
    const c=state.rows.rep;
    if(c&&c.err)return {err:'Não foi possível carregar o relatório: '+c.err};
    return {loading:true,scope:scope,chosen:chosen};
  }
  const ids=new Set(chosen.map(s=>s.id));
  const fid=(state.repCamp==='all'||state.repFile==='all')?null:state.repFile;
  const map={};
  weighRows(rows).forEach(function(w){
    const r=w.r;
    if(!ids.has(r.s)||!r.n)return;
    if(state.repCamp!=='all'&&r.c!==state.repCamp)return;
    if(fid&&r.f!==fid)return;
    const c=campById(r.c),s=screens.find(x=>x.id===r.s);if(!c||!s)return;
    const k=r.c+'|'+r.s,rec=map[k]||(map[k]={c:c,s:s,days:0,dates:[],per:{},impr:0,plays:0,byFile:{},seen:{}});
    const dt=parseISO(r.d),t=dt.getTime();

    (rec.per[t]=rec.per[t]||[]).push({a:r.h,b:r.h+1,out:r.h+1,f:r.f||null,share:1,plays:r.n,impr:w.impr});

  recs.forEach(function(r){
    r.dates.sort((a,b)=>a-b);r.days=r.dates.length;r.impr=Math.round(r.impr);
    Object.keys(r.byFile).forEach(function(k){r.byFile[k].impr=Math.round(r.byFile[k].impr)});

}
function repLabel(d){
  return (!state.repScreens||d.chosen.length===d.scope.length)?'Todos os ecrãs ('+d.scope.length+')':(d.chosen.length===1?d.chosen[0].venue+' · '+d.chosen[0].spot:d.chosen.length+' de '+d.scope.length+' ecrãs');

/* uma linha por campanha, vídeo, ecrã e dia: quando entrou, quando saiu, quantas passagens */
function airLog(recs){
  const rows=[];
  recs.forEach(function(r){
    r.dates.forEach(function(d){
      const segs=r.per[d.getTime()];if(!segs)return;
      const isToday=dayDiff(d,today)===0;
      const merged=[];
      segs.slice().sort((p,q)=>p.a-q.a).forEach(function(x){
        const last=merged.filter(m=>m.f===x.f&&m.b===x.a)[0];
        if(last){last.b=x.b;last.out=x.out;last.plays+=x.plays}else merged.push({a:x.a,b:x.b,out:x.out,f:x.f,plays:x.plays});
      });
      merged.forEach(function(x){
        rows.push({t:d.getTime(),d:d,s:r.s,c:r.c,f:x.f,a:x.a,out:x.out,lost:false,live:isToday&&hourNow>=x.a&&hourNow<x.b,plays:x.plays});
      });
    });
  });
  rows.sort((a,b)=>(b.t-a.t)||a.s.venue.localeCompare(b.s.venue,'pt')||a.s.id.localeCompare(b.s.id)||a.c.name.localeCompare(b.c.name,'pt')||(a.a-b.a));
  return rows;
}

let TOKEN=null;

function ApiError(m,st){this.message=m;this.status=st}
ApiError.prototype=Object.create(Error.prototype);
async function api(method,path,body,raw){
  const h={};if(TOKEN)h.Authorization='Bearer '+TOKEN;
  let b;
  if(body!==undefined&&!raw){h['Content-Type']='application/json';b=JSON.stringify(body)}else b=body;
  let r;
  try{r=await fetch(path,{method:method,headers:h,body:b})}catch(e){throw new ApiError('Sem ligação ao servidor.',0)}
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){
    if(r.status===401&&TOKEN&&path!=='/api/login')sessionLost(j&&j.error);
    throw new ApiError((j&&j.error)||('Erro '+r.status),r.status);
  }
  return j;
}
function sessionLost(msg){

function setArr(a,b){a.length=0;b.forEach(function(x){a.push(x)})}
const sleep=ms=>new Promise(function(r){setTimeout(r,ms)});

const SCR_KEYS=['venue','city','spot','type','res','limit','order','draft','loc','on','off','onT','offT'];
const CMP_KEYS=['name','client','venues','start','end','h0','h1','ppm','dur','priority','manual','color','items'];
const USR_KEYS=['name','email','admin','perms','until','active','photo','notif','ui'];
const emptyBase=()=>({screens:{},campaigns:{},folders:{},contents:{},users:{}});
let base=emptyBase();
function serDoc(coll,o){
  const d={id:o.id};
  if(coll==='screens'){
    SCR_KEYS.forEach(function(k){d[k]=o[k]===undefined?null:o[k]});
    d.order=(o.order||[]).slice();d.draft=o.draft?{order:o.draft.order.slice(),limit:o.draft.limit}:null;
  }else if(coll==='campaigns'){
    CMP_KEYS.forEach(function(k){d[k]=o[k]===undefined?null:o[k]});
    d.start=iso(o.start);d.end=iso(o.end);d.manual=!!o.manual;
    d.items=o.items.map(function(i){return {f:i.f,h0:i.h0==null?null:i.h0,h1:i.h1==null?null:i.h1,d0:i.d0?iso(i.d0):null,d1:i.d1?iso(i.d1):null,ppm:i.ppm||1}});
  }else if(coll==='folders'){d.name=o.name}
  else if(coll==='contents'){d.folder=o.folder||null}
  else if(coll==='users'){
    USR_KEYS.forEach(function(k){d[k]=o[k]===undefined?null:o[k]});
    d.until=o.until?iso(o.until):null;d.photo=o.photo||null;
  }
  return d;
}
function collect(){
  const out=emptyBase();
  screens.forEach(function(o){out.screens[o.id]=serDoc('screens',o)});
  campaigns.forEach(function(o){out.campaigns[o.id]=serDoc('campaigns',o)});
  folders.forEach(function(o){out.folders[o.id]=serDoc('folders',o)});
  contents.forEach(function(o){out.contents[o.id]=serDoc('contents',o)});
  const us=state.user?(state.user.admin?users:[state.user]):[];
  us.forEach(function(o){out.users[o.id]=serDoc('users',o)});
  return out;
}
const clone=o=>JSON.parse(JSON.stringify(o));
function snapshot(){base=clone(collect())}
let extraOps=[];
function diffOps(){
  if(state.user)state.user.ui={dismissed:state.dismissed,finalSeen:state.finalSeen,finalDone:state.finalDone,fewMin:state.fewMin};
  const cur=collect(),ops=[],canPl=can('playlist.gerir'),adm=!!(state.user&&state.user.admin);
  ['screens','campaigns','folders','contents','users'].forEach(function(coll){
    const c=cur[coll],b=base[coll];
    Object.keys(c).forEach(function(id){
      const n=c[id],o=b[id],obj=coll==='users'?(users.find(u=>u.id===id)||state.user):null;
      if(!o){
        if(coll==='contents')return;
        const doc=Object.assign({},n);if(coll==='users'&&obj&&obj._pass)doc.pass=obj._pass;
        ops.push({op:'put',coll:coll,id:id,doc:doc});return;
      }
      let keys=Object.keys(n).filter(k=>k!=='id'&&JSON.stringify(n[k])!==JSON.stringify(o[k]));
      if(coll==='screens'&&!canPl)keys=keys.filter(k=>['order','limit','draft'].indexOf(k)<0);
      if(coll==='users'&&!adm)keys=keys.filter(k=>['photo','notif','ui'].indexOf(k)>-1);
      const doc=Object.assign({},n);
      if(coll==='users'&&obj&&obj._pass&&adm){doc.pass=obj._pass;keys.push('pass')}
      if(keys.length)ops.push({op:'put',coll:coll,id:id,doc:doc,keys:keys});
    });
    if(coll==='screens'||coll==='campaigns'||coll==='folders')Object.keys(b).forEach(function(id){if(!c[id])ops.push({op:'del',coll:coll,id:id})});
  });
  extraOps.forEach(function(o){ops.push(o)});
  return {ops:ops,cur:cur};
}
let saving=false,saveTimer=null,offlineSave=false;
function queueSave(){if(!state.user)return;clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,0)}
async function saveNow(){
  if(!state.user)return;
  if(saving){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,150);return}
  const d=diffOps();if(!d.ops.length)return;
  saving=true;const sent=d.ops.length-extraOps.length;
  const mine=extraOps.slice();
  try{
    await api('POST','/api/sync',{ops:d.ops});
    extraOps=extraOps.filter(o=>mine.indexOf(o)<0);
    d.ops.forEach(function(o){if(o.op==='put'&&o.coll==='users'){const u=users.find(x=>x.id===o.id);if(u)delete u._pass}});
    base=clone(d.cur);offlineSave=false;
  }catch(e){
    if(e.status===0){offlineSave=true;toast('Sem ligação ao servidor. As alterações são enviadas quando a ligação voltar.')}
    else if(e.status!==401){
      extraOps=extraOps.filter(o=>mine.indexOf(o)<0);
      toast(e.message);saving=false;await poll(true);return;
    }
  }
  saving=false;
}
async function flushSave(){
  for(let i=0;i<60;i++){
    if(!saving){await saveNow();if(!saving&&!diffOps().ops.length)return}
    await sleep(100);

}

    trimDraft(s);reopenScreen(s.id);render();
  },
  'limit-set':function(t){
    if(!guard('playlist.gerir'))return;
    const s=screens.find(x=>x.id===t.dataset.id);if(!s)return;
    ensureDraft(s).limit=Math.max(1,Math.min(LIM_MAX,+t.dataset.n));
    trimDraft(s);reopenScreen(s.id);render();
  },
  'pl-copy-venue':function(t){
    if(!guard('playlist.gerir'))return;
    const s=screens.find(x=>x.id===t.dataset.id);if(!s)return;
    const src=cfgOf(s,true),ord=src.order.slice(),lim=src.limit;
    let n=0;
    screens.forEach(function(x){
      if(x===s||x.venue!==s.venue||x.status==='novo')return;
      x.draft={order:ord.slice(),limit:lim};playlistOf(x,true);trimDraft(x);
      if(x.draft)n++;
    });
    toast(n?'Playlist copiada como rascunho para '+n+(n===1?' ecrã':' ecrãs')+' de '+s.venue+'. Pré-visualize e envie.':'Os outros ecrãs de '+s.venue+' já têm esta playlist.');
    render();
  },
  'pl-send':function(t){
    if(!guard('playlist.gerir'))return;
    const s=screens.find(x=>x.id===t.dataset.id);if(!s||!s.draft)return;
    playlistOf(s,true);
    s.order=s.draft.order.slice();s.limit=s.draft.limit;s.draft=null;
    const w=screenIssues(s,false).filter(i=>i.sev==='warn').length;
    toast((s.status==='offline'?'Guardada. O ecrã está sem sinal e atualiza quando voltar a ligar.':'Playlist enviada para '+s.id+'. O player atualiza em instantes.')+(w?' Atenção: ainda há '+w+(w===1?' conflito.':' conflitos.'):''));
    reopenScreen(s.id);render();
  },
  'pl-discard':function(t){
    if(!guard('playlist.gerir'))return;
    const s=screens.find(x=>x.id===t.dataset.id);if(!s)return;
    s.draft=null;toast('Alterações descartadas.');reopenScreen(s.id);render();
  },
  preview:function(t){if(guard('ecras.ver'))previewModal(t.dataset.id)},
  'pv-ver':function(t){if(!pv)return;pv.ver=t.dataset.v;pv.t=0;pvDraw()},
  'pv-toggle':function(t){if(!pv)return;pv.playing=!pv.playing;t.innerHTML=pv.playing?ic('pause')+'Pausa':ic('play')+'Reproduzir'},
  'pv-speed':function(t){if(!pv)return;pv.speed=pv.speed===1?5:(pv.speed===5?10:1);t.textContent='Velocidade '+pv.speed+'×'},
  'pv-next':function(){if(pv)pvJump(1)},
  'pv-prev':function(){if(pv)pvJump(-1)},
  'new-user':function(){userModal()},
  'my-photo':function(){myPhotoModal()},
  'u-photo-pick':function(){const i=$('#u-photo');if(i)i.click()},
  'u-photo-rm':function(){pendingPhoto=null;const u=pvUser();photoPreview(u,null)},
  'edit-user':function(t){userModal(t.dataset.id)},
  logout:function(){const tk=TOKEN;flushSave().then(function(){api('POST','/api/logout',{}).catch(function(){});setToken(null);state.user=null;state.loginDrawn=false;state.loginMsg='';setArr(screens,[]);setArr(campaigns,[]);setArr(contents,[]);setArr(folders,[]);setArr(users,[]);alerts=[];base=emptyBase();closeModal();render()})},
  theme:function(t){applyTheme(t.dataset.m);try{localStorage.setItem('enif-theme',t.dataset.m)}catch(e){}}
};
function applyTheme(m){
  const r=document.documentElement;
  if(m==='light'||m==='dark')r.setAttribute('data-theme',m);else r.removeAttribute('data-theme');
  document.querySelectorAll('[data-a="theme"]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.m===m))});
}
setInterval(function(){if(state.user)checkNotifs()},NSEC);
document.addEventListener('click',function(e){
  const t=e.target.closest('[data-a]');if(!t)return;
  const fn=actions[t.dataset.a];if(fn)fn(t,e);
});
document.addEventListener('input',function(e){
  const id=e.target.id;
  if(id==='q'){state.q=e.target.value;state.limit=14;drawScreenList()}
  else if(id==='c-ppm'||id==='c-dur'){const h=$('#ppm-hint'),p=$('#c-ppm'),d=$('#c-dur');if(h&&p&&d)h.textContent=ppmHint(parseFloat(p.value),parseFloat(d.value))}
  else if(id==='rs-q'){
    const q=e.target.value.trim().toLowerCase();
    document.querySelectorAll('#modal-root .vgroup').forEach(function(g){
      let any=false;
      g.querySelectorAll('.srow').forEach(function(r){
        const ok=!q||r.textContent.toLowerCase().indexOf(q)>-1||g.dataset.venue.toLowerCase().indexOf(q)>-1;
        r.hidden=!ok;if(ok)any=true;
      });
      g.hidden=!any;
    });
  }
});
document.addEventListener('change',function(e){
  const t=e.target,ac=t.dataset&&t.dataset.aChange;
  if(t.id==='rep-camp'){state.repCamp=t.value;state.repFile='all';state.repScreens=null;state.logLimit=25;render()}
  else if(t.id==='rep-file'){state.repFile=t.value;state.logLimit=25;render()}
  else if(t.id==='rep-from'||t.id==='rep-to'){
    const k=t.id==='rep-from'?'from':'to';
    state.custom=state.custom||{from:null,to:null};
    state.custom[k]=t.value?parseISO(t.value):null;state.logLimit=25;render();
  }
  else if(ac==='always'){const w=$('#sch-times');if(w)w.hidden=t.checked}
  else if(ac==='notif-pref'){
    const n=np(state.user),ty=t.dataset.t,c=t.dataset.c;
    if(t.checked&&c==='sms'&&!n.phone){toast('Indique primeiro o telemóvel.');t.checked=false;return}
    if(t.checked&&c==='email'&&!n.email){toast('Indique primeiro o e-mail.');t.checked=false;return}
    if(n.types[ty])n.types[ty][c]=!!t.checked;
  }
  else if(ac==='notif-contact'){
    const n=np(state.user),k=t.dataset.k,v=String(t.value||'').trim();
    if(k==='email'&&v&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){toast('E-mail inválido.');return}
    if(k==='phone'&&v&&v.replace(/\D/g,'').length<9){toast('Telemóvel inválido.');return}
    n[k]=v;
    if(!v)Object.keys(n.types).forEach(ty=>{n.types[ty][k==='phone'?'sms':'email']=false});
    notifModal('pref');toast('Guardado.');
  }
  else if(ac==='few-min'){
    if(!guard('ecras.gerir'))return;
    const n=Math.round(+t.value);
    state.fewMin=(n>=0&&n<=99)?n:state.fewMin;
    toast(state.fewMin>0?'Aviso para ecrãs com menos de '+state.fewMin+' campanhas ativas.':'Aviso de ecrãs com poucas campanhas desligado.');
    render();
  }
  else if(ac==='limit-input'){
    if(!guard('playlist.gerir'))return;
    const s=screens.find(x=>x.id===t.dataset.id);if(!s)return;
    const n=Math.round(+t.value);
    if(!(n>=1)){toast('Indique um número de campanhas a partir de 1.');reopenScreen(s.id);return}
    ensureDraft(s).limit=Math.min(LIM_MAX,n);
    if(n>LIM_MAX)toast('O máximo é '+LIM_MAX+' campanhas.');
    trimDraft(s);reopenScreen(s.id);render();
  }
  else if(ac==='ci-order'){const l=t.closest&&t.closest('.field'),b=l&&l.querySelector('.ci-list');if(b){if(t.value==='manual')b.setAttribute('data-manual','1');else b.removeAttribute('data-manual')}}
  else if(ac==='ci-toggle'){const row=t.closest&&t.closest('.ci-row'),w=row&&row.querySelector('.ci-win');if(w)w.hidden=!t.checked}
  else if(ac==='pv-hour'){if(pv){pv.h=t.value===''?null:+t.value;pv.t=0;pvDraw()}}
  else if(ac==='res'){const c=$('#res-custom');if(c)c.hidden=t.value!=='custom'}
  else if(ac==='vtoggle'){
    const g=t.closest('.vgroup');
    if(g)g.querySelectorAll('input[name="scr"]').forEach(function(i){i.checked=t.checked});
  }
  else if(ac==='role'){
    const set=t.value==='Administrador'?ALL_PERMS:(ROLES[t.value]||null);
    document.querySelectorAll('#perms input[name="perm"]').forEach(function(i){
      i.disabled=t.value==='Administrador';
      if(set)i.checked=set.indexOf(i.value)>-1;
    });
  }
  else if(ac==='assoc'){
    const x=fileById(t.dataset.id),c=campById(t.value);
    if(x&&c&&guard('conteudos.gerir')){
      c.items.push({f:x.id,h0:null,h1:null});
      toast('Conteúdo associado a «'+c.name+'».'+(c.items.length>1?' Os vídeos da campanha passam alternados, um em cada passagem.':''));
      render();
    }
  }
  else if(ac==='mvfolder'){
    const x=fileById(t.dataset.id);
    if(x&&guard('conteudos.gerir')){x.folder=t.value||null;toast(x.folder?'Movido para a pasta «'+folderById(x.folder).name+'».':'Movido para «Sem pasta».');render()}
  }
  else if(t.name==='scr'){
    const g=t.closest('.vgroup');
    if(g){const all=Array.prototype.slice.call(g.querySelectorAll('input[name="scr"]'));const h=g.querySelector('[data-a-change="vtoggle"]');if(h)h.checked=all.every(function(i){return i.checked})}
  }
  else if(t.id==='file-input'){if(can('conteudos.gerir'))addFiles(t.files);t.value=''}
  else if(t.id==='u-photo'){
    const f=t.files&&t.files[0],er=$('#modal-root #form-err');
    if(er)er.textContent='';
    readPhoto(f,function(d){pendingPhoto=d;photoPreview(pvUser(),d)},function(m){if(er)er.textContent=m});
    t.value='';
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});

function readout(e){
  const r=e.target.closest&&e.target.closest('.bar');if(!r)return;
  const h=+r.dataset.h;
  $('#readout').innerHTML='<b>'+pad(h)+':00 – '+pad(h+1)+':00</b> · '+fmt.format(+r.dataset.v)+' impressões estimadas';
}
document.addEventListener('mouseover',readout);
document.addEventListener('focusin',readout);

['dragenter','dragover'].forEach(function(n){document.addEventListener(n,function(e){const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}})});
document.addEventListener('dragleave',function(e){const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',function(e){const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('over');if(can('conteudos.gerir'))addFiles(e.dataTransfer.files)}});

document.addEventListener('submit',function(e){
  const f=e.target;if(!f.dataset||!f.dataset.form)return;
  e.preventDefault();
  const fd=new FormData(f),err=$('#form-err'),kind=f.dataset.form;
  if(kind==='login'||kind==='setup'){doLogin(kind,fd,err);return}
  if(kind==='myphoto'){
    if(!state.user)return;
    if(pendingPhoto!==undefined){if(pendingPhoto)state.user.photo=pendingPhoto;else delete state.user.photo}
    pendingPhoto=undefined;closeModal();toast('Foto atualizada.');render();return;
  }
  if(kind==='user'){
    if(!(state.user&&state.user.admin))return;
    const ex=f.dataset.id?users.find(x=>x.id===f.dataset.id):null;
    const name=String(fd.get('name')||'').trim(),email=String(fd.get('email')||'').trim(),pass=String(fd.get('pass')||'');
    if(!name){err.textContent='Indique o nome.';return}
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){err.textContent='Indique um e-mail válido.';return}
    if(users.some(x=>x!==ex&&x.email.toLowerCase()===email.toLowerCase())){err.textContent='Já existe um utilizador com esse e-mail.';return}
    if(!ex&&pass.length<6){err.textContent='A palavra-passe precisa de pelo menos 6 caracteres.';return}
    if(pass&&pass.length<6){err.textContent='A palavra-passe precisa de pelo menos 6 caracteres.';return}
    const role=String(fd.get('role')||(ex?roleName(ex):'Personalizado'));
    const admin=role==='Administrador';
    const act=ex&&ex===state.user?true:fd.get('active')!=null;
    const untilV=String(fd.get('until')||'');
    const data={name:name,email:email,admin:admin,perms:admin?ALL_PERMS.slice():fd.getAll('perm').filter(p=>ALL_PERMS.indexOf(p)>-1),until:untilV?parseISO(untilV):null,active:act};
    const others=users.filter(x=>x!==ex&&x.admin&&x.active).length;
    if(!(data.admin&&data.active)&&others===0){err.textContent='Tem de existir pelo menos um administrador ativo.';return}
    let tgt=ex;
    if(ex){Object.assign(ex,data);if(pass)ex._pass=pass}
    else{tgt=Object.assign({id:'u'+Date.now().toString(36),_pass:pass},data);users.push(tgt)}
    if(pendingPhoto!==undefined){if(pendingPhoto)tgt.photo=pendingPhoto;else delete tgt.photo}
    pendingPhoto=undefined;
    closeModal();toast(ex?'Utilizador atualizado.':'Utilizador criado.');render();return;
  }
  if(kind==='screen'){
    if(!guard('ecras.gerir'))return;
    const venue=String(fd.get('venue')||'').trim(),spot=String(fd.get('spot')||'').trim(),city=String(fd.get('city')||'').trim();
    if(!venue||!spot){err.textContent='Indique o local e a posição do ecrã.';return}
    const rr=readRes(fd);
    if(rr.err){err.textContent=rr.err;return}
    const pl=readPlace(fd);
    if(pl.err){err.textContent=pl.err;return}
    const limRaw=String(fd.get('limit')==null?'5':fd.get('limit')).trim(),lim=Math.round(+limRaw);
    if(!limRaw||!(lim>=1&&lim<=LIM_MAX)){err.textContent='O máximo de campanhas em simultâneo tem de ser um número entre 1 e '+LIM_MAX+'.';return}
    const known=screens.find(x=>x.venue===venue);
    const nums=screens.map(x=>parseInt(String(x.id).slice(4),10)||0);
    const id='ECR-'+pad3((nums.length?Math.max.apply(null,nums):0)+1);
    screens.push({id:id,venue:venue,city:city||(known?known.city:'—'),spot:spot,type:typeNames[+fd.get('type')]||'Outro',res:rr.v,status:'novo',limit:lim,order:[],draft:null,ping:'',uptime:'',loc:pl.loc,on:pl.on,off:pl.off,onT:pl.onT,offT:pl.offT});
    closeModal();render();
    flushSave().then(function(){return poll(true)}).then(function(){const s2=screens.find(x=>x.id===id);if(s2&&s2.playerKey)pairModal(s2)});
    return;
  }
  if(kind==='folder'){
    if(!guard('conteudos.gerir'))return;
    const name=String(fd.get('name')||'').trim();
    if(!name){err.textContent='Dê um nome à pasta.';return}
    if(folders.some(p=>p.id!==f.dataset.id&&p.name.toLowerCase()===name.toLowerCase())){err.textContent='Já existe uma pasta com esse nome.';return}
    if(f.dataset.id){folderById(f.dataset.id).name=name;toast('Pasta renomeada.')}
    else{const p={id:'P'+(Date.now()%100000),name:name};folders.push(p);state.folder=p.id;toast('Pasta «'+name+'» criada.')}
    closeModal();render();return;
  }
  if(kind==='place'){
    if(!guard('ecras.gerir'))return;
    const s=screens.find(x=>x.id===f.dataset.id),pl=readPlace(fd);
    if(!s)return;
    if(pl.err){err.textContent=pl.err;return}
    Object.assign(s,{loc:pl.loc,on:pl.on,off:pl.off,onT:pl.onT,offT:pl.offT});
    closeModal();toast('Localização e horário atualizados.');render();return;
  }
  if(kind==='res'){
    if(!guard('ecras.gerir'))return;
    const s=screens.find(x=>x.id===f.dataset.id),rr=readRes(fd);
    if(!s)return;
    if(rr.err){err.textContent=rr.err;return}
    s.res=rr.v;toast('Resolução de '+s.id+' atualizada.');render();screenModal(s.id);return;
  }
  if(kind==='repscreens'){
    const sel=fd.getAll('scr'),scope=repScope();
    if(!sel.length){err.textContent='Escolha pelo menos um ecrã.';return}
    state.repScreens=sel.length===scope.length?null:new Set(sel);
    state.logLimit=25;closeModal();render();return;
  }
  if(kind==='export'){
    if(!guard('relatorios.exportar'))return;
    const o={sum:fd.get('inc-sum')!=null,chart:fd.get('inc-chart')!=null,log:fd.get('inc-log')!=null};
    if(!o.sum&&!o.chart&&!o.log){err.textContent='Escolha pelo menos uma parte do relatório.';return}
    closeModal();toast('A gerar o PDF…');doExport(o);return;
  }
  if(!guard('campanhas.gerir'))return;
  const name=String(fd.get('name')||'').trim(),client=String(fd.get('client')||'').trim();
  const vs=fd.getAll('venue'),sv=fd.get('start'),ev=fd.get('end');
  const h0=+fd.get('h0'),h1=+fd.get('h1');
  const ppm=parseFloat(String(fd.get('ppm')).replace(',','.'));
  const dur=Math.round(parseFloat(String(fd.get('dur')).replace(',','.')));
  if(!name){err.textContent='Dê um nome à campanha.';return}
  if(!vs.length){err.textContent='Escolha pelo menos um local.';return}
  if(!sv||!ev||parseISO(ev)<parseISO(sv)){err.textContent='A data de fim tem de ser igual ou posterior à de início.';return}
  if(h1<=h0){err.textContent='A hora de fim tem de ser depois da hora de início.';return}
  if(!(dur>=3&&dur<=60)){err.textContent='Duração do vídeo: indique entre 3 e 60 segundos.';return}
  if(!(ppm>=0.25&&ppm<=12)){err.textContent='Passagens por minuto: indique um valor entre 0,25 e 12.';return}
  const ri=readItems(fd,h0,h1,parseISO(sv),parseISO(ev));
  if(ri.err){err.textContent=ri.err;return}
  const data={name:name,client:client||'Sem cliente',venues:vs,start:parseISO(sv),end:parseISO(ev),h0:h0,h1:h1,ppm:ppm,dur:dur,priority:fd.get('priority'),items:ri.items,manual:ri.manual};
  let c;
  if(f.dataset.id){c=campById(f.dataset.id);Object.assign(c,data)}
  else{c=Object.assign({id:'C'+Date.now().toString(36),color:campaigns.length%6+1},data);campaigns.push(c)}
  closeModal();
  const n=allIssues().reduce((a,g)=>a+(g.i.ids.indexOf(c.id)>-1?g.screens.length:0),0);
  toast((f.dataset.id?'Campanha atualizada.':'Campanha criada.')+(n?' Atenção: conflito de playlist em '+n+(n===1?' ecrã.':' ecrãs.'):''));
  if(state.view!=='campanhas'&&!f.dataset.id){state.view='campanhas'}
  render();
});

try{const sv=localStorage.getItem('enif-theme');if(sv==='light'||sv==='dark')applyTheme(sv)}catch(e){}
['click','change','submit'].forEach(function(ev){document.addEventListener(ev,function(){queueSave()})});
window.addEventListener('beforeunload',function(e){if(state.user&&(saving||extraOps.length)){e.preventDefault();e.returnValue=''}});
boot();
})();
</script>
